<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>古戦場（霞桜団）</title>
<!-- お気に入り/タブのアイコン。
     Safariはアイコンを「URL単位」で覚えるため、ファビコン設置前に一度
     /favicon.ico を404で記録すると、正しいファイルを置いても取り直さない。
     未使用のURLを指すことで強制的に再取得させる(中身は favicon.ico と同一)。
     /favicon.ico も残してあるので、link指定を見ないブラウザはそちらを拾う -->
<link rel="icon" href="/favicon-sakura.ico">
<link rel="apple-touch-icon" href="/favicon-48.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root { --blue:#378ADD; --red:#D85A30; --green:#1D9E75; --bg:#f6f7f9; --card:#fff; --tx:#1c2733; --mut:#68707a; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,"Hiragino Sans",sans-serif; background:var(--bg); color:var(--tx); }
  header { background:#1c2733; color:#fff; padding:14px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:17px; font-weight:600; }
  .tabs { display:flex; gap:4px; margin-left:auto; }
  .tab { padding:7px 16px; border-radius:8px; background:transparent; color:#cfd6dd; border:none; font-size:14px; cursor:pointer; }
  .tab.on { background:var(--blue); color:#fff; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:14px; }
  .metric { background:var(--card); border-radius:10px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .metric .l { font-size:12px; color:var(--mut); }
  .metric .v { font-size:22px; font-weight:600; margin-top:2px; }
  .metric .s { font-size:11px; color:var(--mut); }
  .metric.ours { background:#f1f7fe; box-shadow:inset 3px 0 0 var(--blue), 0 1px 3px rgba(0,0,0,.06); }
  .metric.opp  { background:#fdf4f0; box-shadow:inset 3px 0 0 var(--red),  0 1px 3px rgba(0,0,0,.06); }
  .metric.hero { background:#fdf4f0; box-shadow:inset 3px 0 0 var(--red),  0 1px 3px rgba(0,0,0,.06); }
  .metric.p100k{ background:#eff9f5; box-shadow:inset 3px 0 0 var(--green),0 1px 3px rgba(0,0,0,.06); }
  select,input,button { font-size:14px; padding:8px 10px; border:1px solid #d5dae0; border-radius:8px; background:#fff; }
  button.primary { background:var(--blue); color:#fff; border:none; cursor:pointer; }
  .minitabs { display:flex; gap:6px; margin-bottom:10px; }
  button.minitab { padding:6px 14px; font-size:13px; color:var(--mut); cursor:pointer; }
  button.minitab.on { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600; }
  .chartbox { position:relative; height:240px; }
  h2 { font-size:14px; color:var(--mut); font-weight:600; margin-bottom:8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:6px 8px; text-align:right; border-bottom:1px solid #eef0f2; }
  th:first-child,td:first-child { text-align:left; }
  .good { color:var(--green); font-weight:600; } .bad { color:var(--red); font-weight:600; }
  /* 時速セル。既定は控えめな色にして、その列の最高時速だけ .mx で立たせる。
     .sp を先に書かないと同じ詳細度で .mx の色が打ち消される */
  .sp { color:var(--mut); }
  .mx { color:var(--red); font-weight:700; background:#fdf1e7; border-radius:4px; }
  .load { color:var(--mut); font-size:13px; padding:20px; text-align:center; }
  .hide { display:none; }
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>⚔️ 古戦場（霞桜団）</h1>
  <select id="raidSel" style="font-size:13px;padding:5px 8px;border-radius:8px;border:none;background:#2e3d4d;color:#fff"></select>
  <div class="tabs">
    <button class="tab on" data-tab="live">ライブ</button>
    <button class="tab" data-tab="scout">サーチ</button>
    <button class="tab" data-tab="koran">個ラン</button>
  </div>
</header>
<main>

<div id="pane-live">
  <div class="card">
    <div class="row">
      <label style="font-size:13px;color:var(--mut)">対象日</label>
      <select id="dateSel"></select>
      <label id="oppLabel" style="font-size:13px;color:var(--mut)">相手</label>
      <input id="oppInput" placeholder="相手団名 または 団ID" style="flex:1;min-width:140px">
      <label id="pastLabel" style="font-size:13px;color:var(--mut)">過去比較</label>
      <select id="pastSel">
        <option value="0">なし</option>
        <option value="1" selected>前日</option>
        <option value="9">全本戦日</option>
      </select>
      <button class="primary" onclick="loadLive()">更新</button>
      <label style="font-size:12px;color:var(--mut)" title="gbfdataは毎時更新なので、新しい時刻のデータが出たら自動で取り直します"><input type="checkbox" id="autoRef"> 更新時に自動更新</label>
    </div>
  </div>
  <div id="liveBody"><div class="load">「更新」を押すと集計します（初回は30秒ほどかかります）</div></div>
</div>

<div id="pane-scout" class="hide">
  <div class="card">
    <div class="row">
      <input id="scoutQ" placeholder="相手の団名 または 団ID" style="flex:1;min-width:200px">
      <button class="primary" onclick="loadScout()">分析</button>
    </div>
    <div style="font-size:11px;color:var(--mut);margin-top:6px">団名は完全一致優先(上位3000位内)。見つからない場合はゲーム内URLの団IDで指定</div>
  </div>
  <div id="scoutBody"></div>
</div>

<div id="pane-koran" class="hide">
  <div class="card">
    <div class="row">
      <input id="koranQ" placeholder="プレイヤー名 または ユーザーID" style="flex:1;min-width:180px">
      <label style="font-size:13px;color:var(--mut)">表示</label>
      <select id="koranDay"></select>
      <label style="font-size:12px;color:var(--mut)" title="gbfdataは毎時更新なので、新しい時刻のデータが出たら自動で取り直します"><input type="checkbox" id="koranAuto"> 更新時に自動更新</label>
      <label style="font-size:13px;color:var(--mut)">比較</label>
      <select id="koranTgt">
        <option value="both">両方</option>
        <option value="100k">10万位</option>
        <option value="2000">英雄(2000位)</option>
      </select>
      <button class="primary" onclick="loadKoran()">検索</button>
    </div>
    <div style="font-size:11px;color:var(--mut);margin-top:6px">個人貢献度を 英雄ライン(2000位)・10万位ライン と比較。「表示」で概要(日別)か対象日の時刻毎を選択。<br>
      ※個ランについて順位によってはデータ取得に時間がかかる、または取得不可の場合があります。（順位帯毎に個人を検索しているため）</div>
  </div>
  <div id="koranBody"><div class="load">プレイヤー名かユーザーIDを入れて「検索」</div></div>
</div>

</main>
<script>
const $=s=>document.querySelector(s);
// 数値を小数点1桁で表示(nullは—)。予選・本戦・スカウト全テーブル/カードで統一
const f1=x=>(x!=null&&x!=='')?(+x).toFixed(1):'—';
let charts={}, cfg=null, timer=null, LAST_TICK=null, retryN=0;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  $('#pane-live').classList.toggle('hide', b.dataset.tab!=='live');
  $('#pane-scout').classList.toggle('hide', b.dataset.tab!=='scout');
  $('#pane-koran').classList.toggle('hide', b.dataset.tab!=='koran');
});
function mkChart(id,type,labels,datasets,extra={}){
  if(charts[id]) charts[id].destroy();
  charts[id]=new Chart($(id),{type,data:{labels,datasets},options:{
    responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:true,labels:{boxWidth:14,font:{size:11}}}},
    scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{ticks:{font:{size:10}}}},...extra}});
}
// 古戦場の「今日」(JST基準・5時未満はまだ前日扱い)
function gbfToday(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  const d=new Date(Date.UTC(+g('year'), +g('month')-1, +g('day')));
  if(+g('hour')<5) d.setUTCDate(d.getUTCDate()-1);
  return d.toISOString().slice(0,10);
}
function fillDates(){
  const battle=(cfg.schedules||[]).filter(s=>s.day_of>=4);
  const sel=$('#dateSel'); sel.innerHTML='';
  const yo=document.createElement('option'); yo.value='yosen'; yo.textContent='予選'; sel.appendChild(yo);
  battle.forEach(s=>{const o=document.createElement('option');o.value=s.day;o.textContent=`本戦${s.day_of-3}日目 (${s.day})`;sel.appendChild(o);});
  // 開いた日の日程を自動選択（予選期間中は予選、本戦N日目なら本戦N日目）
  const today=gbfToday(), sch=cfg.schedules||[];
  const cur=sch.find(s=>s.day===today);
  if(cur && cur.day_of>=4){
    const i=battle.findIndex(s=>s.day===today);
    sel.selectedIndex=i>=0?i+1:0;
  }else{
    sel.selectedIndex=0;            // 予選・IB・開催期間外は「予選」
  }
  sel.onchange=syncYosenUI; syncYosenUI();
}
function syncYosenUI(){
  const yo=$('#dateSel').value==='yosen';
  // 予選は相手団不要・過去比較は前回予選のみ → グレーアウト
  ['#oppInput','#pastSel'].forEach(s=>{const e=$(s); e.disabled=yo; e.style.opacity=yo?0.4:1;});
  $('#oppLabel').style.opacity=yo?0.4:1; $('#pastLabel').style.opacity=yo?0.4:1;
}
async function fetchJSON(url,tries=4){
  for(let i=0;i<tries;i++){
    try{ const r=await fetch(url); if(r.ok) return await r.json(); }catch(e){}
    await new Promise(res=>setTimeout(res, 1500));
  }
  throw new Error('fetch failed: '+url);
}
async function init(raid){
  try{
    cfg=await fetchJSON('/api/config'+(raid?'?raid='+raid:''));
  }catch(e){
    setTimeout(()=>init(raid), 3000); return;
  }
  const rs=$('#raidSel');
  if(!rs.options.length){
    (cfg.raids||[cfg.raid]).forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=`第${r}回`;rs.appendChild(o);});
    rs.value=cfg.raid;
    rs.onchange=()=>{init(rs.value); $('#liveBody').innerHTML='<div class="load">「更新」を押すと集計します</div>'; $('#scoutBody').innerHTML=''; $('#koranBody').innerHTML='<div class="load">プレイヤー名かユーザーIDを入れて「検索」</div>';};
  }
  fillDates();
  fillKoranDays();
}
// 時刻表示: 日をまたいだ25〜30時は 1〜6時 と表す(24:00はそのまま24)
const hLbl=t=>{const h=parseInt(t);return String(h>24?h-24:h);};
// 時速列の最高値。同値が複数あれば全部に印を付ける
const mxOf=arr=>{const v=arr.filter(x=>x!=null&&!isNaN(x));return v.length?Math.max(...v):null;};
const mxCls=(v,m)=>(m!=null&&v!=null&&Math.abs(v-m)<1e-9)?" mx":"";
const KORAN_LBL={1:'予選1日目',2:'予選2日目',3:'インターバル',4:'本戦1日目',5:'本戦2日目',6:'本戦3日目',7:'本戦4日目'};
function fillKoranDays(){
  const sel=$('#koranDay'); if(!sel) return; sel.innerHTML='';
  const o0=document.createElement('option'); o0.value=''; o0.textContent='概要(日別)'; sel.appendChild(o0);
  (cfg.schedules||[]).slice().sort((a,b)=>a.day_of-b.day_of).forEach(s=>{
    const o=document.createElement('option'); o.value=s.day; o.textContent=`${KORAN_LBL[s.day_of]||s.day_of}`; sel.appendChild(o);});
}
// 団チャット貼り付け用の文章（例: 9時時点でこちら99.8億(40.2億)　相手14.6億(9.5億)　貢献差85.2億(30.7億)）
function chatLine(t,o,p,os_,ps_,withSpeed){
  const d=o-p;
  if(!withSpeed) return `${t}時時点でこちら${f1(o)}億　相手${f1(p)}億　貢献差${f1(d)}億`;
  return `${t}時時点でこちら${f1(o)}億(${f1(os_)}億)　相手${f1(p)}億(${f1(ps_)}億)　貢献差${f1(d)}億(${f1(os_-ps_)}億)`;
}
// 予選用（相手→300ボーダー、末尾に団順位）
function chatLineYosen(t,o,b,os_,bs_,rank,withSpeed){
  const d=o-b, rk=(rank!=null)?`　団順位${rank}位`:'';
  if(!withSpeed) return `${t}時点でこちら${f1(o)}億　300ボーダー${f1(b)}億　貢献差${f1(d)}億${rk}`;
  return `${t}時点でこちら${f1(o)}億(${f1(os_)}億)　300ボーダー${f1(b)}億(${f1(bs_)}億)　貢献差${f1(d)}億(${f1(os_-bs_)}億)${rk}`;
}
// 予選の参考情報: 過去6回の300位ボーダー(属性・開催日・前回比つき)
function yosenBorderHistHtml(hist,curBorder){
  if(!hist||!hist.length) return '';
  const mx=Math.max(...hist.map(x=>x.border));
  const rows=hist.map(x=>{
    const up=x.up!=null?`<td class="${x.up>=0?'bad':'good'}">${x.up>0?'+':''}${x.up.toFixed(1)}%</td>`:'<td>—</td>';
    return `<tr><td>第${x.raid}回</td><td>${x.element||'—'}</td><td style="color:var(--mut)">${x.when||'—'}</td>`
      +`<td class="${x.border===mx?'mx':''}">${f1(x.border)}</td>${up}</tr>`;}).join('');
  const avg=hist.reduce((a,x)=>a+x.border,0)/hist.length;
  const vs=(curBorder!=null&&avg)?Math.round(curBorder/avg*100):null;
  return `<div class="card"><h2>参考：過去6回の予選300位ボーダー（億）</h2>
    <div style="overflow-x:auto"><table>
      <tr><th>回</th><th>属性</th><th>開催</th><th>300位</th><th>前回比</th></tr>${rows}
      <tr><td colspan="3" style="color:var(--mut)">6回平均</td><td>${f1(avg)}</td><td>—</td></tr>
    </table></div>
    ${vs!=null?`<div style="font-size:12px;color:var(--mut);margin-top:6px">今回の現時点 ${f1(curBorder)}億 は6回平均の ${vs}%。ボーダーは開催ごとに上がる傾向があるので、直近の回との比較が目安になります。</div>`:''}
  </div>`;
}
function chatNoticeYosenHtml(L,oc,bc,os,bs,ranks){
  const lines=[];
  L.forEach((t,i)=>{ if(oc[i]==null||bc[i]==null) return;
    lines.push(chatLineYosen(t,oc[i],bc[i],os[i],bs[i],ranks[i], i>0 && os[i]!=null && bs[i]!=null)); });
  return chatBox(lines);
}
function chatNoticeHtml(H,oc,pc,os,ps){
  const lines=[];
  H.forEach((t,i)=>{ if(oc[i]==null||pc[i]==null) return;
    lines.push(chatLine(t,oc[i],pc[i],os[i],ps[i], i>0 && os[i]!=null && ps[i]!=null)); });
  return chatBox(lines);
}
function chatBox(lines){
  if(!lines.length) return '';
  CHAT=lines;
  const latest=lines[lines.length-1];
  return `<div class="card"><h2>団チャット通知用</h2>
    <div id="chatLatest" style="background:#f2f6fa;border:1px solid #d5dae0;border-radius:8px;padding:12px;font-size:14px;line-height:1.6;word-break:break-all">${latest}</div>
    <div class="row" style="margin-top:8px">
      <button class="primary" onclick="copyChat('latest',this)">最新の1行をコピー</button>
      <button onclick="copyChat('all',this)" style="cursor:pointer">全時刻をコピー</button>
      <span id="chatMsg" style="font-size:12px;color:var(--green)"></span>
    </div>
    <details style="margin-top:10px"><summary style="font-size:12px;color:var(--mut);cursor:pointer">全時刻の文章を見る（${lines.length}行）</summary>
      <div style="font-size:13px;line-height:1.9;margin-top:6px;word-break:break-all">${lines.join('<br>')}</div></details></div>`;
}
let CHAT=[];
async function copyChat(mode,btn){
  const txt=mode==='all'?CHAT.join('\n'):CHAT[CHAT.length-1];
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  const m=$('#chatMsg'); if(m){ m.textContent='コピーしました'; setTimeout(()=>{m.textContent='';},2000); }
}
function paceJudge(ratio){
  if(ratio==null) return null;
  const pct=Math.round(ratio*100);
  if(pct>=115) return {pct,txt:'前日より加速中',bg:'#fcebeb',fg:'#A32D2D'};
  if(pct>=85)  return {pct,txt:'前日並みペース',bg:'#faeeda',fg:'#854F0B'};
  if(pct>=60)  return {pct,txt:'前日より減速',bg:'#e6f1fb',fg:'#185FA5'};
  return {pct,txt:'撤退の可能性大',bg:'#e1f5ee',fg:'#0F6E56'};
}
async function loadYosen(){
  $('#liveBody').innerHTML='<div class="load">予選データ取得中…(初回は15〜30秒)</div>';
  let d;
  try{ d=await (await fetch('/api/yosen?raid='+$('#raidSel').value)).json(); }
  catch(e){ $('#liveBody').innerHTML='<div class="card bad">取得に時間がかかり切断されました。もう一度「更新」を押してください</div>'; return; }
  if(d.error){$('#liveBody').innerHTML=`<div class="card bad">${d.error}</div>`;return;}
  if(!d.keys||!d.keys.length){$('#liveBody').innerHTML='<div class="card" style="color:var(--mut)">この回の予選毎時データはgbfdataに未収録です（古い開催回では予選の時間毎データが残っていません）。本戦の日別実績は本戦日を選ぶと表示できます。</div>';return;}
  const K=d.keys, L=d.labels;
  const oc=K.map(k=>d.ours.cum[k]??null), bc=K.map(k=>d.border.cum[k]??null);
  const os=K.map(k=>d.ours.speed[k]??null), bs=K.map(k=>d.border.speed[k]??null);
  const orank=K.map(k=>d.ours.rank[k]??null);
  const li=oc.map((v,i)=>v!=null?i:-1).reduce((a,b)=>Math.max(a,b),-1);
  LAST_TICK='yosen:'+(li>=0?L[li]:'');
  const lo=li>=0?oc[li]:null, lb=li>=0?bc[li]:null, lr=li>=0?orank[li]:null;
  const diff=(lo!=null&&lb!=null)?lo-lb:null;
  const p=d.prev;
  const mxO=mxOf(os), mxB=mxOf(bs);   // 時速のピーク(表で強調する)
  // 前回を開始時刻(20時)そろえでインデックス整列(今回と前回どちらも同じ予選タイムライン構造)
  const pcum=(side)=>{ if(!p)return[]; const pv=Object.values(p[side].cum);
    return K.map((_,i)=>i<pv.length?pv[i]:null); };
  const pspd=(side)=>{ if(!p)return[]; const pv=Object.values(p[side].speed||{});
    return K.map((_,i)=>i<pv.length?pv[i]:null); };
  const pb=pcum('border');
  // 300位ボーダー 今回 vs 前回(同時刻)
  const lpb=(li>=0&&li<pb.length)?pb[li]:null;
  const bdiff=(lb!=null&&lpb!=null)?lb-lpb:null;
  const bpct=(lb!=null&&lpb)?Math.round(lb/lpb*100):null;
  // 前回同時刻比の文言(上昇/減少の度合い)
  const trendTxt=(pct)=>{ if(pct==null)return''; if(pct>=110)return'（今回大きく上昇）'; if(pct>=103)return'（今回やや上昇）'; if(pct>=98)return'（前回とほぼ同水準）'; if(pct>=90)return'（今回やや減少）'; return'（今回大きく減少）'; };
  // 300位ボーダー着地予想: 現時点の300位 × (前回最終300位 ÷ 前回同時刻300位)
  const pbAll=p?Object.values(p.border.cum):[];
  const prevFinal=pbAll.length?pbAll[pbAll.length-1]:null;
  const projFinal=(lb!=null&&lpb&&prevFinal)?lb*(prevFinal/lpb):null;
  const ourMargin=(lo!=null&&projFinal!=null)?lo-projFinal:null;  // 現時点自団 − 着地予想
  $('#liveBody').innerHTML=`
    <div class="metrics">

// gbfdataは毎時更新。毎時3分に取り直し、まだ新データが無ければ3分おきに再試行(最大5回)
function scheduleAutoRefresh(){
  if(timer){ clearTimeout(timer); timer=null; }
  if(!$('#autoRef').checked) return;
  const now=new Date(), next=new Date(now);
  next.setMinutes(3,0,0);
  if(next<=now) next.setHours(next.getHours()+1);
  retryN=0;
  timer=setTimeout(autoTick, next-now);
}
async function autoTick(){
  timer=null;
  if(!$('#autoRef').checked) return;
  const before=LAST_TICK;
  await ($('#dateSel').value==='yosen'?loadYosen():loadLive());
  if(LAST_TICK===before && retryN<5){        // まだgbfdataに反映されていない
    retryN++;
    timer=setTimeout(autoTick, 180000);
  }else{
    scheduleAutoRefresh();                    // 次の毎時へ
  }
}
$('#autoRef').onchange=scheduleAutoRefresh;

    const hd=[4,5,6,7].map(k=>dd[k]!=null?dd[k]:null);

  // 直近イベントと勝敗カウント
  const ev=[...d.events].sort((a,b)=>a.raid-b.raid);      // 古い順
  const last=d.events[0]||{};
  const avgDiff=(d.ours_avg!=null&&d.past_avg!=null)?(d.ours_avg-d.past_avg):null;

  const cards=`<div class="metrics">

    <div class="metric opp"><div class="l">相手 本戦日毎平均</div><div class="v">${f1(d.past_avg)}<span style="font-size:12px">億</span></div><div class="s">直近3回の本戦</div></div>
    <div class="metric ours"><div class="l">霞桜団 本戦日毎平均</div><div class="v ${avgDiff!=null?(avgDiff>=0?'good':'bad'):''}">${f1(d.ours_avg)}<span style="font-size:12px">億</span></div><div class="s">${avgDiff!=null?(avgDiff>=0?'+':'')+f1(avgDiff)+'億 差':'同期間'}</div></div>
    ${d.winrate!=null?`<div class="metric"><div class="l">勝率目安</div><div class="v ${wcls}">${d.winrate}%</div><div class="s">${d.win_note?`直近${d.win_note.raids}回の本戦 ${d.win_note.days}日中 霞桜団が上回り ${d.win_note.wins}日`:''}</div></div>`:''}
  </div>`;
  // 過去3戦の本戦比較テーブル
  const p3=d.events.slice(0,3);
  // 直近3開催 × 本戦1〜4 の当日貢献度で日別比較
  const DN={4:'本戦1日目',5:'本戦2日目',6:'本戦3日目',7:'本戦4日目'};
  const p3rows=p3.slice().reverse().map(e=>[4,5,6,7].map(k=>{
    const o=(e.ours_honsen_days||{})[k], p=(e.honsen_days||{})[k];
    if(o==null&&p==null) return '';
    const df=(o!=null&&p!=null)?o-p:null;
    const win=df!=null?(df>=0?'<span class="badge" style="background:#e1f5ee;color:#0F6E56">勝</span>':'<span class="badge" style="background:#fcebeb;color:#A32D2D">負</span>'):'';
    return `<tr><td>${e.raid}回 ${DN[k]}</td><td>${f1(o)}</td><td>${f1(p)}</td><td class="${df!=null?(df>=0?'good':'bad'):''}">${df!=null?(df>0?'+':'')+f1(df):'—'}</td><td>${win}</td></tr>`;
  }).join('')).join('');
  const dayWins=p3.reduce((a,e)=>a+[4,5,6,7].filter(k=>{
    const o=(e.ours_honsen_days||{})[k],p=(e.honsen_days||{})[k];
    return o!=null&&p!=null&&o>p;}).length,0);
  const dayN=p3.reduce((a,e)=>a+[4,5,6,7].filter(k=>{
    const o=(e.ours_honsen_days||{})[k],p=(e.honsen_days||{})[k];
    return o!=null&&p!=null;}).length,0);
  $('#scoutBody').innerHTML=`
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><b style="font-size:16px">${d.name}</b> <a href="${d.url}" target="_blank" style="font-size:12px">団ページ↗</a></div>${wr}
      </div>
    </div>
    ${cards}
    <div class="card"><h2>直近3開催 本戦1〜4の当日貢献度比較（霞桜団 ${dayWins}勝 / ${dayN}戦）</h2><div style="overflow-x:auto"><table>
      <tr><th>日程</th><th>霞桜団</th><th>${d.name}</th><th>差</th><th>判定</th></tr>${p3rows}</table></div></div>
    <div class="card"><h2>直近3回の本戦貢献度比較（青=霞桜団 / 赤=${d.name}）</h2><div class="chartbox"><canvas id="scTot"></canvas></div></div>
    <div class="card"><h2>総合順位の推移（直近3開催 予選〜本戦）</h2><div class="chartbox" style="height:220px"><canvas id="scRank"></canvas></div></div>
    <div class="card"><h2 id="scSpdTitle">本戦の最高時速（青=霞桜団 / 赤=${d.name}）</h2><div id="scSpdBox"><div class="load">時速データ取得中…(20秒ほど)</div></div></div>
    <div class="card"><h2>前日の比較</h2><div id="scPrevBox"><div class="load">前日データ取得中…</div></div></div>
    ${scoutMembersHtml(d.members,d.name)}
    <div class="card"><h2>${d.name} の過去実績（億）</h2><div style="overflow-x:auto"><table>
      <tr><th>回</th><th>予選</th><th>本1</th><th>本2</th><th>本3</th><th>本4</th><th>本戦計</th><th>総計</th><th>順位</th><th>霞桜団との差</th></tr>${evRows}</table></div>
      <div style="font-size:11px;color:var(--mut);margin-top:6px">赤字=その回で最も稼いだ本戦日 ／ 差=霞桜団の本戦計 − 相手の本戦計</div></div>`;
  // 直近3開催 × 本戦1〜4 の当日貢献度
  const dl=[], do1=[], dp1=[];
  p3.slice().reverse().forEach(e=>[4,5,6,7].forEach(k=>{
    const o=(e.ours_honsen_days||{})[k], p=(e.honsen_days||{})[k];
    if(o==null&&p==null) return;
    dl.push(`${e.raid}回${DN[k].replace('本戦','本')}`); do1.push(o??null); dp1.push(p??null);
  }));
  mkChart('#scTot','bar',dl,[
    {label:'霞桜団',data:do1,backgroundColor:'#378ADD',borderRadius:3},
    {label:d.name,data:dp1,backgroundColor:'#D85A30',borderRadius:3}
  ]);
  const rh=d.rank_history||[];
  mkChart('#scRank','line',rh.map(r=>r.label),[
    {label:'霞桜団',data:rh.map(r=>r.ours),borderColor:'#378ADD',backgroundColor:'#378ADD',tension:0.2,borderWidth:2.5,pointRadius:3,spanGaps:true},
    {label:d.name,data:rh.map(r=>r.opp),borderColor:'#D85A30',backgroundColor:'#D85A30',tension:0.2,borderWidth:2.5,pointRadius:3,spanGaps:true}
  ],{scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{reverse:true,ticks:{font:{size:10},callback:v=>v+'位'}}}});
  loadScoutSpeed(d.gid, d.name);
}
async function loadScoutSpeed(gid,oppName){
  const box=$('#scSpdBox'); if(!box) return;
  let s;
  try{ s=await (await fetch('/api/scout_speed?gid='+gid+'&raid='+$('#raidSel').value)).json(); }
  catch(e){ box.innerHTML='<div style="font-size:12px;color:var(--mut)">時速データの取得に時間がかかり切断されました</div>'; return; }
  if(!$('#scSpdBox')) return;                       // 別の検索に切り替わっていたら中断
  scoutPrevView(s.prev,oppName);
  if(s.error||!s.days||!s.days.length){ box.innerHTML=`<div style="font-size:12px;color:var(--mut)">${s.error||'この回の時刻毎データはgbfdataに未収録です'}</div>`; return; }
  const L=s.days.map(x=>x.label);
  const om=s.days.map(x=>x.ours_max), oa=s.days.map(x=>x.ours_avg);
  const pm=s.days.map(x=>x.opp_max), pa=s.days.map(x=>x.opp_avg);
  const cell=(a,b)=>`<td class="${(a!=null&&b!=null)?(a>=b?'good':'bad'):''}">${(a!=null&&b!=null)?((a-b>0?'+':'')+f1(a-b)):'—'}</td>`;
  const rowsMax=s.days.map(x=>`<tr><td>${x.label}</td><td>${f1(x.ours_max)}</td><td>${f1(x.opp_max)}</td>${cell(x.ours_max,x.opp_max)}</tr>`).join('');
  const rowsAvg=s.days.map(x=>`<tr><td>${x.label}</td><td>${f1(x.ours_avg)}</td><td>${f1(x.opp_avg)}</td>${cell(x.ours_avg,x.opp_avg)}</tr>`).join('');
  box.innerHTML=`
    <div class="minitabs">
      <button class="minitab on" data-spd="max" onclick="scoutSpeedTab('max')">最高時速</button>
      <button class="minitab" data-spd="avg" onclick="scoutSpeedTab('avg')">平均時速</button>
    </div>
    <div class="chartbox"><canvas id="scSpd"></canvas></div>
    <div id="scSpdTable" style="overflow-x:auto;margin-top:10px"></div>`;
  SPD={L, om, oa, pm, pa, oppName,
       tblMax:`<table><tr><th>日程</th><th>霞桜団 最高時速</th><th>${oppName} 最高時速</th><th>最高時速差</th></tr>${rowsMax}</table>`,
       tblAvg:`<table><tr><th>日程</th><th>霞桜団 平均時速</th><th>${oppName} 平均時速</th><th>平均時速差</th></tr>${rowsAvg}</table>`};
  scoutSpeedTab('max');
}
function scoutPrevView(prev,oppName){
  const box=$('#scPrevBox'); if(!box) return;
  if(!prev){ box.innerHTML='<div style="font-size:12px;color:var(--mut)">前日のデータがありません</div>'; return; }
  if(prev.mode==='daily'){
    const rows=prev.rows.map(r=>{const df=(r.ours!=null&&r.opp!=null)?r.ours-r.opp:null;
      return `<tr><td>${r.label}</td><td>${f1(r.ours)}</td><td>${f1(r.opp)}</td><td class="${df!=null?(df>=0?'good':'bad'):''}">${df!=null?(df>0?'+':'')+f1(df):'—'}</td></tr>`;}).join('');
    box.innerHTML=`<div style="font-size:12px;color:var(--mut);margin-bottom:6px">${prev.label}</div>
      <div style="overflow-x:auto"><table><tr><th>日程</th><th>霞桜団</th><th>${oppName}</th><th>差</th></tr>${rows}</table></div>`;
    return;
  }
  const T=prev.times, oc=prev.ours.cum, os=prev.ours.speed, pc=prev.opp.cum, ps=prev.opp.speed;
  const ork=prev.ours.rank||{}, prk=prev.opp.rank||{};
  const rk=v=>v?v.toLocaleString('ja-JP')+'位':'—';
  const mO=mxOf(T.map(t=>os[t])), mP2=mxOf(T.map(t=>ps[t]));
  const rows=T.filter(t=>oc[t]!=null||pc[t]!=null).map(t=>{
    const o=oc[t],p=pc[t],df=(o!=null&&p!=null)?o-p:null;
    return `<tr><td>${hLbl(t)}時</td><td>${f1(o)}</td><td style="color:var(--mut)">${rk(ork[t])}</td><td class="sp${mxCls(os[t],mO)}">${f1(os[t])}</td><td>${f1(p)}</td><td style="color:var(--mut)">${rk(prk[t])}</td><td class="sp${mxCls(ps[t],mP2)}">${f1(ps[t])}</td><td class="${df!=null?(df>=0?'good':'bad'):''}">${df!=null?(df>0?'+':'')+f1(df):'—'}</td></tr>`;}).join('');
  if(!rows){ box.innerHTML='<div style="font-size:12px;color:var(--mut)">前日の時刻毎データはgbfdataに未収録です</div>'; return; }
  const L=T.filter(t=>oc[t]!=null||pc[t]!=null);
  box.innerHTML=`<div style="font-size:12px;color:var(--mut);margin-bottom:6px">${prev.label}</div>
    <div class="chartbox"><canvas id="scPrevCum"></canvas></div>
    <div class="chartbox" style="margin-top:12px"><canvas id="scPrevSpd"></canvas></div>
    <div style="overflow-x:auto;margin-top:12px"><table><tr><th>時刻</th><th>霞桜団</th><th>総合順位</th><th>時速</th><th>${oppName}</th><th>総合順位</th><th>時速</th><th>差</th></tr>${rows}</table></div>`;
  const lab=L.map(hLbl);
  mkChart('#scPrevCum','line',lab,[
    {label:'霞桜団 累積',data:L.map(t=>oc[t]??null),borderColor:'#378ADD',backgroundColor:'#378ADD',tension:.3,borderWidth:2.5,pointRadius:2,spanGaps:true},
    {label:oppName+' 累積',data:L.map(t=>pc[t]??null),borderColor:'#D85A30',backgroundColor:'#D85A30',tension:.3,borderWidth:2.5,pointRadius:2,spanGaps:true}
  ]);
  mkChart('#scPrevSpd','line',lab,[
    {label:'霞桜団 時速',data:L.map(t=>os[t]??null),borderColor:'#378ADD',backgroundColor:'#378ADD',tension:.3,borderWidth:2.5,pointRadius:2,spanGaps:true},
    {label:oppName+' 時速',data:L.map(t=>ps[t]??null),borderColor:'#D85A30',backgroundColor:'#D85A30',tension:.3,borderWidth:2.5,pointRadius:2,spanGaps:true}
  ]);
}
let SPD=null;
function scoutMembersHtml(mv,name){
  if(!mv) return `<div class="card"><h2>${name} の団員一覧</h2>
    <div style="font-size:12px;color:var(--mut)">この団は団員一覧を非公開にしています（gbfdataに登録がありません）。上位団ほど非公開の傾向があります。</div></div>`;
  const ctx=mv.context||{}, lbl=KORAN_LBL[ctx.day_of]||'';
  const share=(mv.total&&mv.top5)?Math.round(mv.top5/mv.total*100):null;
  const rows=mv.rows.map((r,i)=>`<tr><td style="color:var(--mut)">${i+1}</td><td>${r.name??'—'}</td>`
    +`<td>${r.point!=null?f1(r.point):'—'}</td>`
    +`<td style="color:var(--mut)">${r.rank?r.rank.toLocaleString('ja-JP')+'位':'—'}</td></tr>`).join('');
  return `<div class="card"><h2>${name} の団員一覧（${lbl}時点・億）</h2>
    <div style="font-size:12px;color:var(--mut);margin-bottom:8px">${mv.count}人中 ${mv.ranked}人に貢献度の記録あり ／ 合計 ${f1(mv.total)}億${share!=null?` ／ 上位5人で ${f1(mv.top5)}億（全体の${share}%）`:''}</div>
    <div style="overflow-x:auto"><table><tr><th>団内</th><th>名前</th><th>貢献度</th><th>個人順位</th></tr>${rows}</table></div>
    <div style="font-size:11px;color:var(--mut);margin-top:6px">貢献度の多い順。記録が無い団員は今回の個人ランキング圏外です。</div></div>`;
}
function scoutSpeedTab(mode){
  if(!SPD) return;
  document.querySelectorAll('.minitab').forEach(b=>b.classList.toggle('on', b.dataset.spd===mode));
  const isMax=mode==='max';
  $('#scSpdTable').innerHTML=isMax?SPD.tblMax:SPD.tblAvg;
  // 見出しは選択中のタブに追従させる(最高/平均どちらを見ているか一目で分かるように)
  const t=$('#scSpdTitle');
  if(t) t.textContent=`本戦の${isMax?'最高':'平均'}時速（青=霞桜団 / 赤=${SPD.oppName}）`;
  mkChart('#scSpd','bar',SPD.L,[
    {label:'霞桜団 '+(isMax?'最高時速':'平均時速'),data:isMax?SPD.om:SPD.oa,backgroundColor:'#378ADD',borderRadius:3},
    {label:SPD.oppName+' '+(isMax?'最高時速':'平均時速'),data:isMax?SPD.pm:SPD.pa,backgroundColor:'#D85A30',borderRadius:3}
  ]);
}

async function loadKoran(){
  const q=$('#koranQ').value.trim(); if(!q)return;
  const day=$('#koranDay').value;
  $('#koranBody').innerHTML=`<div class="load">${day?'時刻毎データ取得中…(初回は30秒ほど)':'検索中…(初回は30秒ほど)'}</div>`;
  let d;
  try{ d=await (await fetch('/api/koran?q='+encodeURIComponent(q)+'&raid='+$('#raidSel').value+(day?'&day='+day:''))).json(); }
  catch(e){ $('#koranBody').innerHTML='<div class="card bad">取得に時間がかかり切断されました。もう一度「検索」を押してください</div>'; return; }
  if(d.error){$('#koranBody').innerHTML=`<div class="card bad">${d.error}</div>`;return;}
  if(d.candidates){
    const rows=d.candidates.map(c=>`<tr><td style="text-align:left">${c.name}</td><td>${c.rank?c.rank+'位':'—'}</td><td>${f1(c.point)}億</td><td><button onclick="$('#koranQ').value='${c.user_id}';loadKoran()">このプレイヤー</button></td></tr>`).join('');
    $('#koranBody').innerHTML=`<div class="card"><h2>該当プレイヤーが${d.candidates.length}件 — 現在順位・累積で選択</h2><table><tr><th style="text-align:left">名前</th><th>現順位</th><th>累積</th><th></th></tr>${rows}</table></div>`;
    return;
  }
  if(d.mode==='hourly'){ return koranHourlyView(d); }
  const tg=$('#koranTgt').value, s2=tg!=='100k', s1=tg!=='2000';
  const L=d.latest||{};
  KORAN_TICK='d:'+((L.label||'')+':'+(L.player??''));
  const vs2=v=> v==null?'':(v>=0?`<span class="good">英雄ライン超え +${f1(v)}億</span>`:`英雄ラインまで ${f1(-v)}億`);
  const vs1=v=> v==null?'':(v>=0?`<span class="good">10万位 圏内 +${f1(v)}億</span>`:`<span class="bad">10万位まで ${f1(-v)}億</span>`);
  const cards=`<div class="metrics">
    <div class="metric ours"><div class="l">${d.name} 累積貢献度</div><div class="v">${f1(L.player)}<span style="font-size:12px">億</span></div><div class="s">${L.rank?L.rank+'位':''}${L.label?`（${L.label}時点）`:''}</div></div>
    ${s2?`<div class="metric hero"><div class="l">英雄ライン(2000位)</div><div class="v">${f1(L.b2000)}<span style="font-size:12px">億</span></div><div class="s">${vs2(L.vs2000)}</div></div>`:''}
    ${s1?`<div class="metric p100k"><div class="l">10万位ライン</div><div class="v">${f1(L.b100k)}<span style="font-size:12px">億</span></div><div class="s">${vs1(L.vs100k)}</div></div>`:''}
  </div>`;
  const P=d.proj||{};
  const projNote=(v2,v1)=>{const s=[];
    if(s2&&v2!=null)s.push(v2>=0?`<span class="good">英雄ライン到達見込み +${f1(v2)}億</span>`:`英雄ラインまで ${f1(-v2)}億`);
    if(s1&&v1!=null)s.push(v1>=0?`10万位 圏内見込み`:`<span class="bad">10万位 圏外見込み</span>`);
    return s.join(' / ');};
  const lw=d.confirmed?'着地':'着地目安', subw=d.confirmed?'確定値':'前回最終からの予測';
  const projSection=(P.player!=null||P.b2000!=null||P.b100k!=null)?`
    <div class="card" style="padding-bottom:4px"><h2>${d.confirmed?`着地（第${d.raid}回・確定）`:`着地目安（前回第${P.prev_raid}回のペース比${P.label?` ／ ${P.label}時点を基準`:''}）`}</h2>
    <div class="metrics">
      <div class="metric ours"><div class="l">${d.name} ${lw}</div><div class="v">${f1(P.player)}<span style="font-size:12px">億</span></div><div class="s">${projNote(P.vs2000,P.vs100k)}</div></div>
      ${s2?`<div class="metric hero"><div class="l">英雄ライン(2000位) ${lw}</div><div class="v">${f1(P.b2000)}<span style="font-size:12px">億</span></div><div class="s">${subw}</div></div>`:''}
      ${s1?`<div class="metric p100k"><div class="l">10万位ライン ${lw}</div><div class="v">${f1(P.b100k)}<span style="font-size:12px">億</span></div><div class="s">${subw}</div></div>`:''}
    </div></div>`:'';
  const cell=(v,neg)=>`<td class="${v!=null?(v>=0?'good':'bad'):''}">${v!=null?(v>=0?'+':'')+f1(v):'—'}</td>`;
  const trows=d.rows.map(r=>`<tr><td>${r.label}</td><td>${f1(r.player)}</td><td style="color:var(--mut)">${r.rank?r.rank+'位':'—'}</td>`
    +(s2?`<td>${f1(r.b2000)}</td>${cell(r.vs2000)}`:'')
    +(s1?`<td>${f1(r.b100k)}</td>${cell(r.vs100k)}`:'')+`</tr>`).join('');
  const chartLbl=[s2&&'赤=英雄(2000位)',s1&&'緑=10万位'].filter(Boolean).join(' / ');
  $('#koranBody').innerHTML=`
    <div class="card"><div class="row" style="justify-content:space-between"><div><b style="font-size:16px">${d.name}</b> <a href="${d.url}" target="_blank" style="font-size:12px">gbfdata↗</a></div></div></div>
    ${cards}
    ${projSection}
    <div class="card"><h2>累積貢献度の推移（億）— 青=本人${chartLbl?' / '+chartLbl:''}</h2><div class="chartbox"><canvas id="kCum"></canvas></div></div>
    <div class="card"><h2>日別の比較（数値・億）</h2><div style="overflow-x:auto"><table><tr><th>日程</th><th>${d.name}</th><th>順位</th>${s2?'<th>英雄(2000位)</th><th>差</th>':''}${s1?'<th>10万位</th><th>差</th>':''}</tr>${trows}</table></div></div>
    ${koranPast3Html(d.past3,s2,s1,d.name)}`;
  const Lx=d.rows.map(r=>r.label);
  mkChart('#kCum','line',Lx,[
    {label:d.name,data:d.rows.map(r=>r.player),borderColor:'#378ADD',backgroundColor:'#378ADD',tension:0.2,borderWidth:2.5,pointRadius:3},
    ...(s2?[{label:'英雄(2000位)',data:d.rows.map(r=>r.b2000),borderColor:'#D85A30',tension:0.2,borderWidth:2,pointRadius:0}]:[]),
    ...(s1?[{label:'10万位',data:d.rows.map(r=>r.b100k),borderColor:'#1D9E75',tension:0.2,borderWidth:2,pointRadius:0}]:[])
  ]);
}
// 個ランの自動更新(ライブと同じ: 毎時3分＋3分おき再試行)
let kTimer=null, KORAN_TICK=null, kRetryN=0;
function scheduleKoranRefresh(){
  if(kTimer){ clearTimeout(kTimer); kTimer=null; }
  if(!$('#koranAuto')?.checked) return;
  const now=new Date(), next=new Date(now);
  next.setMinutes(3,0,0);
  if(next<=now) next.setHours(next.getHours()+1);
  kRetryN=0;
  kTimer=setTimeout(koranTick, next-now);
}
async function koranTick(){
  kTimer=null;
  if(!$('#koranAuto')?.checked) return;
  if(!$('#koranQ').value.trim()){ scheduleKoranRefresh(); return; }
  const before=KORAN_TICK;
  await loadKoran();
  if(KORAN_TICK===before && kRetryN<5){ kRetryN++; kTimer=setTimeout(koranTick,180000); }
  else scheduleKoranRefresh();
}
function koranHourlyView(d){
  const tg=$('#koranTgt').value, s2=tg!=='100k', s1=tg!=='2000';
  const T=d.times, Lx=d.labels;
  const pc=d.player.cum, prk=d.player.rank, psp=d.player.speed;
  const b2=d.b2000.cum, b2s=d.b2000.speed, b1=d.b100k.cum, b1s=d.b100k.speed;
  // 最新時刻の値
  KORAN_TICK='h:'+d.date+':'+(T[T.length-1]||'');
  const li=[...T].reverse().find(t=>pc[t]!=null);
  const lb=T[T.length-1];
  const pv=li!=null?pc[li]:null, v2=lb?b2[lb]:null, v1=lb?b1[lb]:null;
  const d2=(pv!=null&&v2!=null)?pv-v2:null, d1=(pv!=null&&v1!=null)?pv-v1:null;
  const cards=`<div class="metrics">
    <div class="metric ours"><div class="l">${d.name}（${li||''}時点）</div><div class="v">${f1(pv)}<span style="font-size:12px">億</span></div><div class="s">${li!=null&&prk[li]?prk[li]+'位':''}</div></div>
    ${s2?`<div class="metric hero"><div class="l">英雄ライン(2000位)</div><div class="v">${f1(v2)}<span style="font-size:12px">億</span></div><div class="s">${d2!=null?(d2>=0?`<span class="good">超え +${f1(d2)}億</span>`:`あと ${f1(-d2)}億`):''}</div></div>`:''}
    ${s1?`<div class="metric p100k"><div class="l">10万位ライン</div><div class="v">${f1(v1)}<span style="font-size:12px">億</span></div><div class="s">${d1!=null?(d1>=0?`<span class="good">圏内 +${f1(d1)}億</span>`:`<span class="bad">あと ${f1(-d1)}億</span>`):''}</div></div>`:''}
  </div>`;
  const dcell=v=>`<td class="${v!=null?(v>=0?'good':'bad'):''}">${v!=null?(v>=0?'+':'')+f1(v):'—'}</td>`;
  const mP=mxOf(T.map(t=>psp[t])), m2=mxOf(T.map(t=>b2s[t])), m1=mxOf(T.map(t=>b1s[t]));
  const trows=T.map(t=>{const dd2=(pc[t]!=null&&b2[t]!=null)?pc[t]-b2[t]:null, dd1=(pc[t]!=null&&b1[t]!=null)?pc[t]-b1[t]:null;
    return `<tr><td>${Lx[T.indexOf(t)]}</td><td>${f1(pc[t])}</td><td style="color:var(--mut)">${prk[t]?prk[t]+'位':'—'}</td><td class="sp${mxCls(psp[t],mP)}">${f1(psp[t])}</td>`
      +(s2?`<td>${f1(b2[t])}</td><td class="sp${mxCls(b2s[t],m2)}">${f1(b2s[t])}</td>${dcell(dd2)}`:'')
      +(s1?`<td>${f1(b1[t])}</td><td class="sp${mxCls(b1s[t],m1)}">${f1(b1s[t])}</td>${dcell(dd1)}`:'')+`</tr>`;}).join('');
  const chartLbl=[s2&&'赤=英雄(2000位)',s1&&'緑=10万位'].filter(Boolean).join(' / ');
  $('#koranBody').innerHTML=`
    <div class="card"><div class="row" style="justify-content:space-between"><div><b style="font-size:16px">${d.name}</b> <a href="${d.url}" target="_blank" style="font-size:12px">gbfdata↗</a> <span style="font-size:12px;color:var(--mut)">${d.label} 時刻毎</span></div></div></div>
    ${cards}
    ${koranTimeProjHtml(d.proj,s2,s1,d.name,d.confirmed)}
    <div class="card"><h2>${d.label} 累積の推移（億・1H）— 青=本人${chartLbl?' / '+chartLbl:''}</h2><div class="chartbox"><canvas id="kCumH"></canvas></div></div>
    <div class="card"><h2>時速（億・1H）</h2><div class="chartbox"><canvas id="kSpdH"></canvas></div></div>
    <div class="card"><h2>${d.label}（億単位）</h2><div style="overflow-x:auto"><table><tr><th>時刻</th><th>${d.name}</th><th>順位</th><th>時速</th>${s2?'<th>2000位</th><th>時速</th><th>差</th>':''}${s1?'<th>10万位</th><th>時速</th><th>差</th>':''}</tr>${trows}</table></div></div>
    ${koranPast3Html(d.past3,s2,s1,d.name)}`;
  mkChart('#kCumH','line',Lx,[
    {label:d.name,data:T.map(t=>pc[t]??null),borderColor:'#378ADD',backgroundColor:'#378ADD',tension:0.2,borderWidth:2.5,pointRadius:2,spanGaps:true},
    ...(s2?[{label:'英雄(2000位)',data:T.map(t=>b2[t]??null),borderColor:'#D85A30',tension:0.2,borderWidth:2,pointRadius:0,spanGaps:true}]:[]),
    ...(s1?[{label:'10万位',data:T.map(t=>b1[t]??null),borderColor:'#1D9E75',tension:0.2,borderWidth:2,pointRadius:0,spanGaps:true}]:[])
  ]);
  mkChart('#kSpdH','line',Lx,[
    {label:d.name,data:T.map(t=>psp[t]??null),borderColor:'#378ADD',tension:0.2,borderWidth:2,pointRadius:2,spanGaps:true},
    ...(s2?[{label:'英雄(2000位)',data:T.map(t=>b2s[t]??null),borderColor:'#D85A30',tension:0.2,borderWidth:1.5,pointRadius:0,spanGaps:true}]:[]),
    ...(s1?[{label:'10万位',data:T.map(t=>b1s[t]??null),borderColor:'#1D9E75',tension:0.2,borderWidth:1.5,pointRadius:0,spanGaps:true}]:[])
  ]);
}
init();
</script>
