<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>古戦場（霞桜団）</title>
<!-- お気に入り/タブのアイコン。
     Safariはアイコンを「URL単位」で覚えるため、ファビコン設置前に一度
     /favicon.ico を404で記録すると、正しいファイルを置いても取り直さない。
     未使用のURLを指すことで強制的に再取得させる(中身は favicon.ico と同一)。
     /favicon.ico も残してあるので、link指定を見ないブラウザはそちらを拾う -->
<link rel="icon" href="/favicon-sakura.ico">
<link rel="apple-touch-icon" href="/favicon-48.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root { --blue:#378ADD; --red:#D85A30; --green:#1D9E75; --bg:#f6f7f9; --card:#fff; --tx:#1c2733; --mut:#68707a; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,"Hiragino Sans",sans-serif; background:var(--bg); color:var(--tx); }
  header { background:#1c2733; color:#fff; padding:14px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:17px; font-weight:600; }
  .tabs { display:flex; gap:4px; margin-left:auto; }
  .tab { padding:7px 16px; border-radius:8px; background:transparent; color:#cfd6dd; border:none; font-size:14px; cursor:pointer; }
  .tab.on { background:var(--blue); color:#fff; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  /* チェックボックスは1グループに。個別に折り返して1つだけ次行へ落ちるのを防ぐ */
  .chks { display:flex; gap:14px; align-items:center; }
  .chks label { font-size:12px; color:var(--mut); white-space:nowrap; display:flex; align-items:center; gap:4px; }
  /* 保存ボタンは隣のチェックと大きさを揃える(操作列で浮かないように) */
  .chks button { font-size:12px; color:var(--mut); padding:0 10px; height:18px; line-height:1;
                 border-radius:5px; white-space:nowrap; cursor:pointer; }
  .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:14px; }
  .metric { background:var(--card); border-radius:10px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .metric .l { font-size:12px; color:var(--mut); }
  .metric .v { font-size:22px; font-weight:600; margin-top:2px; }
  .metric .s { font-size:11px; color:var(--mut); }
  .metric.ours { background:#f1f7fe; box-shadow:inset 3px 0 0 var(--blue), 0 1px 3px rgba(0,0,0,.06); }
  .metric.opp  { background:#fdf4f0; box-shadow:inset 3px 0 0 var(--red),  0 1px 3px rgba(0,0,0,.06); }
  .metric.hero { background:#fdf4f0; box-shadow:inset 3px 0 0 var(--red),  0 1px 3px rgba(0,0,0,.06); }
  .metric.p100k{ background:#eff9f5; box-shadow:inset 3px 0 0 var(--green),0 1px 3px rgba(0,0,0,.06); }
  /* ---- 本戦の判断バンド(hero)と数値ストリップ ---- */
  .hero { background:var(--card); border:1px solid #e3e8ee; border-radius:12px;
          box-shadow:0 1px 3px rgba(28,39,51,.07); overflow:hidden; }
  .heroTop { display:grid; grid-template-columns:auto 1fr auto; gap:22px; align-items:center; padding:22px 24px; }
  @media (max-width:620px){
    .heroTop { grid-template-columns:1fr; gap:10px; }
    /* 狭い画面では左右の余白がグラフ幅を大きく削るので詰める(上下は残す) */
    main { padding:10px; }
    .card { padding:14px 10px; }
    table { font-size:12px; }
    th,td { padding:6px 5px; }
  }
  .heroLead .k, .heroWin .k { font-size:11.5px; color:var(--mut); }
  .heroLead .v { font-size:40px; font-weight:700; letter-spacing:-.02em; line-height:1.15; }
  .heroWin { text-align:right; }
  .heroWin .v { font-size:32px; font-weight:700; letter-spacing:-.02em; }
  .heroMid { min-width:0; }
  .heroMid .st { font-size:14px; font-weight:600; margin-bottom:9px; }
  .heroMid .sub { font-size:11.5px; color:var(--mut); margin-top:9px; }
  .heroAct { border-top:1px solid #e3e8ee; padding:15px 24px; display:flex; gap:13px;
             align-items:flex-start; background:var(--bg); }
  .heroAct .tx { font-size:13px; color:var(--tx); line-height:1.7; }
  .bar { height:9px; border-radius:5px; background:rgba(127,139,153,.16); overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:5px; }
  /* 「悪い」を赤にしない。相手団の赤(--red)と見分けが付かないため、記号と語と濃いインクで示す */
  .up { color:var(--green); font-weight:700; }
  .dn { color:var(--tx); font-weight:700; }
  .up .mk, .dn .mk { font-size:.8em; margin-right:2px; }
  .strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:1px;
           background:#e3e8ee; border:1px solid #e3e8ee; border-radius:10px;
           overflow:hidden; margin-top:10px; margin-bottom:14px; }
  /* 直接の子だけに当てる。`.strip div` だと内側のバーにも padding と背景が乗って潰れる */
  .strip > div { background:var(--card); padding:9px 12px; display:flex; flex-direction:column; }
  .strip .k { font-size:11px; color:var(--mut); }
  /* 高さが揃わない(パターンはバーぶん高い)ので、値は残りの空きの中央に置く */
  .strip .v { font-size:16px; font-weight:600; margin:auto 0; }
  .strip .v .u { font-size:10.5px; color:var(--mut); font-weight:600; }
  /* 下段(型・方針)はパターンのバーを置くぶん広めに。上段と隙間なく続ける */
  .strip2 { grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); margin-top:6px; }
  .pat { display:flex; height:7px; border-radius:4px; overflow:hidden; margin-top:5px; gap:2px; }
  .pat i { display:block; }
  .patlg { display:flex; gap:4px 8px; margin-top:5px; font-size:10.5px; color:var(--mut); flex-wrap:wrap; }
  .patlg span { white-space:nowrap; }
  /* ---- 順位帯のマス目 ---- */
  .hm { display:grid; gap:3px; font-size:11px; overflow-x:auto; }
  .hm .hd { font-size:10.5px; color:var(--mut); text-align:center; padding-bottom:2px; }
  .hm .rl { font-size:11.5px; color:var(--mut); display:flex; align-items:center; white-space:nowrap;
            overflow:hidden; text-overflow:ellipsis; }
  .hm .cell { height:30px; border-radius:5px; display:flex; align-items:center; justify-content:center;
              font-weight:600; font-size:11px; font-variant-numeric:tabular-nums; }
  .hmkey { display:flex; gap:12px; flex-wrap:wrap; margin-top:11px; font-size:11px; color:var(--mut); }
  .hmkey span { display:flex; align-items:center; gap:5px; }
  .hmkey i { width:13px; height:13px; border-radius:3px; display:block; }
  select,input,button { font-size:14px; padding:8px 10px; border:1px solid #d5dae0; border-radius:8px; background:#fff; }
  button.primary { background:var(--blue); color:#fff; border:none; cursor:pointer; }
  .minitabs { display:flex; gap:6px; margin-bottom:10px; }
  button.minitab { padding:6px 14px; font-size:13px; color:var(--mut); cursor:pointer; }
  button.minitab.on { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:600; }
  .chartbox { position:relative; height:240px; }
  /* カード内に複数のグラフを置くときの小見出し。h2より小さく、凡例チップの上に出す */
  .subcap { font-size:12.5px; font-weight:600; color:var(--mut); margin:0 0 7px; }
  /* 凡例。Chart.jsの箱ではなく自前のチップで出す。
     実線=今回 / 破線=前回 の線種差まで見せるため */
  .keys { display:flex; flex-wrap:wrap; gap:3px 14px; margin:0 0 7px; padding:0; list-style:none; }
  .keys li { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--mut); }
  .kl { width:16px; height:3px; border-radius:2px; flex:none; }
  .kl.dash { height:0; border-top:2px dashed currentColor; border-radius:0; }
  h2 { font-size:14px; color:var(--mut); font-weight:600; margin-bottom:8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:6px 8px; text-align:right; border-bottom:1px solid #eef0f2; }
  /* 横スクロールさせる表。width:100%のままだと列が痩せて日本語が1文字ずつ折り返るので、
     幅は中身なり(min-width:100%で狭い表は従来どおり全幅)にして折り返しを止める */
  .tw { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tw table { width:auto; min-width:100%; }
  .tw th, .tw td { white-space:nowrap; }
  th:first-child,td:first-child { text-align:left; }
  /* 1列目が順位番号の表。名前の2列目を左寄せにする(数値列は右寄せのまま) */
  table.rank th:nth-child(2), table.rank td:nth-child(2) { text-align:left; }
  .good { color:var(--green); font-weight:600; } .bad { color:var(--red); font-weight:600; }
  /* 時速セル。既定は控えめな色にして、その列の最高時速だけ .mx で立たせる。
     .sp を先に書かないと同じ詳細度で .mx の色が打ち消される */
  .sp { color:var(--mut); }
  .mx { color:var(--red); font-weight:700; background:#fdf1e7; border-radius:4px; }
  /* 日別のTOP5。1位は塗りつぶし＋白文字、以下は薄くしていく。
     .sp より後に書かないと文字色が打ち消される。
     実測: 段どうしのΔEは16〜22、5位と無色の差は11.4、文字と背景のコントラストは4.8以上 */
  .t1 { color:#fff;    font-weight:700; background:#B85515; border-radius:4px; }
  .t2 { color:#401804; font-weight:700; background:#E08141; border-radius:4px; }
  .t3 { color:#5C2408; font-weight:600; background:#F0AC72; border-radius:4px; }
  .t4 { color:#66290C; font-weight:600; background:#F8D0AE; border-radius:4px; }
  .t5 { color:#733312; font-weight:600; background:#FDECDD; border-radius:4px; }
  .load { color:var(--mut); font-size:13px; padding:20px; text-align:center; }
  .hide { display:none; }
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>⚔️ 古戦場（霞桜団）</h1>
  <select id="raidSel" style="font-size:13px;padding:5px 8px;border-radius:8px;border:none;background:#2e3d4d;color:#fff"></select>
  <div class="tabs">
    <button class="tab on" data-tab="live">ライブ</button>
    <button class="tab" data-tab="scout">サーチ</button>
    <button class="tab" data-tab="koran">個ラン</button>
  </div>
</header>
<main>

<div id="pane-live">
  <div class="card">
    <div class="row">
      <label style="font-size:13px;color:var(--mut)">対象日</label>
      <select id="dateSel"></select>
      <label id="oppLabel" style="font-size:13px;color:var(--mut)">相手</label>
      <input id="oppInput" placeholder="相手団名 または 団ID" style="flex:1;min-width:120px">
      <label id="pastLabel" style="font-size:13px;color:var(--mut)">過去比較</label>
      <select id="pastSel">
        <option value="0">なし</option>
        <option value="1" selected>前日</option>
      </select>
      <button class="primary" onclick="loadLive()">更新</button>
      <span class="chks">
        <label title="gbfdataは毎時更新なので、新しい時刻のデータが出たら自動で取り直します"><input type="checkbox" id="autoRef"> 自動更新</label>
        <label id="retreatLabel" title="団として撤退したらチェック。切り替えにはパスワードが必要で、団員全員の画面に反映されます"><input type="checkbox" id="retreatChk"> 撤退済み</label>
        <button id="oppSave" title="この日の対戦相手として保存します。次からは日付を選ぶだけで自動で入り、団員の画面にも同じ相手が入ります">相手を保存</button>
      </span>
    </div>
  </div>
  <div id="liveBody"><div class="load">「更新」を押すと集計します（初回は30秒ほどかかります）</div></div>
</div>

<div id="pane-scout" class="hide">
  <div class="card">
    <div class="row">
      <input id="scoutQ" placeholder="相手の団名 または 団ID" style="flex:1;min-width:200px">
      <button class="primary" onclick="loadScout()">分析</button>
    </div>
    <div style="font-size:11px;color:var(--mut);margin-top:6px">団名は完全一致優先(上位3000位内)。見つからない場合はゲーム内URLの団IDで指定</div>
  </div>
  <div id="scoutBody"></div>
</div>

<div id="pane-koran" class="hide">
  <div class="card">
    <div class="row">
      <select id="koranMem" onchange="pickKoranMem()" title="団員から選ぶ"></select>
      <input id="koranQ" placeholder="プレイヤー名 または ユーザーID" style="flex:1;min-width:180px">
      <label style="font-size:12px;color:var(--mut)" title="gbfdataは毎時更新なので、新しい時刻のデータが出たら自動で取り直します"><input type="checkbox" id="koranAuto"> 自動更新</label>
      <label style="font-size:13px;color:var(--mut)">比較</label>
      <select id="koranTgt">
        <option value="both">両方</option>
        <option value="100k">10万位</option>
        <option value="2000">英雄(2000位)</option>
      </select>
      <button class="primary" onclick="loadKoran()">検索</button>
      <button onclick="loadKoranAll()" title="団員30名をまとめて表示します">団全体</button>
    </div>
    <div style="font-size:11px;color:var(--mut);margin-top:6px">個人貢献度を 英雄ライン(2000位)・10万位ライン と比較。日別の推移に加え、開催中の当日（終了後は最終日）の時刻毎を自動で下に足します。<br>
      ※個ランについて順位によってはデータ取得に時間がかかる、または取得不可の場合があります。（順位帯毎に個人を検索しているため）</div>
  </div>
  <div id="koranBody"><div class="load">プレイヤー名かユーザーIDを入れて「検索」</div></div>
</div>

</main>
<script>
const $=s=>document.querySelector(s);
// 数値を小数点1桁で表示(nullは—)。予選・本戦・スカウト全テーブル/カードで統一
const f1=x=>(x!=null&&x!=='')?(+x).toFixed(1):'—';
let charts={}, cfg=null, timer=null, LAST_TICK=null, retryN=0;
let LAST_OPP=null;   // 直近で集計した相手(gid,name)。保存時に団名も残すのに使う
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  $('#pane-live').classList.toggle('hide', b.dataset.tab!=='live');
  $('#pane-scout').classList.toggle('hide', b.dataset.tab!=='scout');
  $('#pane-koran').classList.toggle('hide', b.dataset.tab!=='koran');
});
// 面の塗り。上端を濃く下端を透明に抜く。初回は chartArea がまだ無いので透明を返す
const areaGrad=(hex,top)=>ctx=>{
  const a=ctx.chart.chartArea; if(!a) return hex+'00';
  const g=ctx.chart.ctx.createLinearGradient(0,a.top,0,a.bottom);
  g.addColorStop(0,hex+top); g.addColorStop(1,hex+'00'); return g;
};
// 棒の塗り。下端まで透明にすると低い棒が読めなくなるので b8 で止める
const barGrad=hex=>ctx=>{
  const a=ctx.chart.chartArea; if(!a) return hex;
  const g=ctx.chart.ctx.createLinearGradient(0,a.top,0,a.bottom);
  g.addColorStop(0,hex); g.addColorStop(1,hex+'b8'); return g;
};
// 線の終端に系列名と最終値を直接置く。ds.endLabel を持つ系列だけが対象。
// 近づいた札は下へ押し分ける
const endLabelPlugin={id:'endLabel',afterDatasetsDraw(chart){
  const ctx=chart.ctx, picks=[];
  chart.data.datasets.forEach((ds,i)=>{
    if(!ds.endLabel) return;
    const m=chart.getDatasetMeta(i); if(m.hidden||!m.data.length) return;
    let j=ds.data.length-1; while(j>=0 && ds.data[j]==null) j--;
    if(j<0||!m.data[j]) return;
    picks.push({x:m.data[j].x,y:m.data[j].y,color:ds.borderColor,text:ds.label+' '+ds.data[j]});
  });
  picks.sort((a,b)=>a.y-b.y);
  for(let i=1;i<picks.length;i++) if(picks[i].y-picks[i-1].y<15) picks[i].y=picks[i-1].y+15;
  picks.forEach(p=>{
    ctx.save();
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,3.5,0,Math.PI*2); ctx.fill();
    ctx.font="600 11px -apple-system,'Hiragino Sans',sans-serif";
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillText(p.text,p.x-8,p.y-9);
    ctx.restore();
  });
}};
// 縦の基準線。options.refLines を持つグラフだけに引く(横棒グラフで英雄/10万位を示す)
// ⚠️ 棒の「上」に引くこと。beforeDatasetsDrawだと、棒の内側に入る線
//    (10万位のように多くの人が超えているライン)が全部隠れて見えなくなる
const refLinePlugin={id:'refLine',afterDatasetsDraw(chart){
  const rl=chart.options.refLines; if(!rl||!rl.length) return;
  const {ctx,chartArea:a,scales:{x}}=chart;
  rl.forEach(r=>{
    if(r.v==null) return;
    const px=x.getPixelForValue(r.v);
    if(px<a.left||px>a.right) return;
    ctx.save();
    // ⚠️ 色を濃くするだけでは、一番濃い棒(本戦4日目)の上でコントラストが1.2まで落ちて埋もれる。
    //    白い縁取りを先に引いて、どの段の上でも必ず切り離す
    ctx.beginPath(); ctx.moveTo(px,a.top); ctx.lineTo(px,a.bottom);
    ctx.strokeStyle='#fff'; ctx.lineWidth=4.5; ctx.stroke();
    ctx.strokeStyle=r.color; ctx.lineWidth=2.2; ctx.setLineDash([6,4]);
    ctx.stroke();
    ctx.setLineDash([]);
    // ラベルは白文字の帯。線の色に白文字でコントラスト4.9以上ある
    ctx.font="700 11px -apple-system,'Hiragino Sans',sans-serif";
    ctx.textAlign='left'; ctx.textBaseline='middle';
    const w=ctx.measureText(r.label).width, bx=px+5, by=a.top+2;
    ctx.fillStyle=r.color;
    ctx.beginPath(); ctx.roundRect(bx,by,w+12,17,4); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.fillText(r.label,bx+6,by+9);
    ctx.restore();
  });
}};
// データセットから凡例チップを組み立て、グラフの直前に差し込む
function drawKeys(canvas,datasets){
  const box=canvas.closest('.chartbox'); if(!box) return;
  let ul=box.previousElementSibling;
  if(!ul||!ul.classList.contains('keys')){
    ul=document.createElement('ul'); ul.className='keys';
    box.parentNode.insertBefore(ul,box);
  }
  ul.innerHTML=datasets.map(ds=>{
    const c=ds.keyColor||ds.borderColor||ds.backgroundColor||'#888';
    const col=(typeof c==='string')?c:'#888';
    return ds.borderDash
      ? `<li style="color:${col}"><span class="kl dash"></span><span style="color:var(--mut)">${ds.label}</span></li>`
      : `<li><span class="kl" style="background:${col}"></span>${ds.label}</li>`;
  }).join('');
}
// 終端の札(endLabelPlugin)は点の「左」に描くので、右余白は終端の点(半径3.5)が
// 枠に接しない分だけでよい。以前は札の幅ぶん80〜104px空けていたが、全て死に余白だった
const padR=()=>window.innerWidth<620?10:16;
function mkChart(id,type,labels,datasets,extra={}){
  const el=$(id); if(!el) return;      // 描画先が消えていたら何もしない
  if(charts[id]) charts[id].destroy();
  // ds.area='3d' のように指定された系列だけ面を塗る(累積グラフの主役のみ)
  datasets.forEach(ds=>{
    if(ds.area){ ds.keyColor=ds.borderColor; ds.backgroundColor=areaGrad(ds.borderColor,ds.area); ds.fill=true; }
    else if(ds.bar){ ds.keyColor=ds.bar; ds.backgroundColor=barGrad(ds.bar); }
  });
  drawKeys(el,datasets);
  charts[id]=new Chart(el,{type,data:{labels,datasets},plugins:[endLabelPlugin,refLinePlugin],options:{
    responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
    layout:{padding:{top:10,right:padR()}},
    // 回転などで幅が変わったら余白も取り直す(作成時の値のままだと横向きで痩せる)
    onResize(ch){ ch.options.layout.padding.right=padR(); },
    plugins:{

// 古戦場の「今日」(JST基準・5時未満はまだ前日扱い)
function gbfToday(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;
  const d=new Date(Date.UTC(+g('year'), +g('month')-1, +g('day')));
  if(+g('hour')<5) d.setUTCDate(d.getUTCDate()-1);
  return d.toISOString().slice(0,10);
}

function koranTargetDay(rows){
  const sch=(cfg.schedules||[]);
  const t=gbfToday();
  const cur=sch.find(s=>s.day===t);
  if(cur) return cur;
  const dos=(rows||[]).map(r=>r.day_of).filter(v=>v!=null);

function yosenBorderHistHtml(hist,curBorder){

  </div>`;
}

// 撤退は団の意思決定なので自動判定できず、団員全員の画面に反映させたい。
// 状態はサーバが持ち、切り替えはパスワードを知っている団長だけができる。
// パスワードはこのタブの間だけ覚える(sessionStorage)。保存も送信もしない。
function retreatPw(){
  let pw='';
  try{ pw=sessionStorage.getItem('retreatPw')||''; }catch(e){}
  if(!pw){
    pw=prompt('パスワード')||'';
    if(pw){ try{ sessionStorage.setItem('retreatPw',pw); }catch(e){} }
  }
  return pw;
}
async function toggleRetreat(){
  const on=$('#retreatChk').checked;
  const pw=retreatPw();
  if(!pw){ $('#retreatChk').checked=!on; return; }
  let r;
  try{
    r=await (await fetch('/api/retreat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({raid:$('#raidSel').value,date:$('#dateSel').value,on,pw})})).json();
  }catch(e){ r={error:'通信できませんでした'}; }
  if(r.error){
    try{ sessionStorage.removeItem('retreatPw'); }catch(e){}   // パスワードが違うなら覚え直す
    $('#retreatChk').checked=!on;
    alert(r.error);
    return;
  }
  if(!r.persisted) alert('切り替えましたが、保存先(スプレッドシート)に書けませんでした。サーバが再起動すると戻ります');
  loadLive();
}
// 時間帯パターンを4分割バーで見せる。「朝36% 昼23%…」の文字列だと折り返して読めない
const PAT_C={朝:'#E8B44A',昼:'#5AA8E8',夕:'#D8894A',夜:'#6E6BAF'};
function patCell(p,who){
  if(!p) return '';
  const seg=Object.entries(p.pct).map(([k,v])=>`<i style="flex:${v};background:${PAT_C[k]}" title="${k} ${v}%"></i>`).join('');
  const lg=Object.entries(p.pct).map(([k,v])=>`<span>${k}${v}%</span>`).join('');
  return `<div><div class="k">${who} パターン</div><div class="v" style="font-size:14px;margin-bottom:0">${p.label}</div>
    <div class="pat">${seg}</div><div class="patlg">${lg}</div></div>`;
}
// 総合順位は順位帯のマス目で見せる。折れ線だと自団(112〜423位)の変動が
// 相手のスケールに潰されて真っ平らに見えるため。上位ほど赤・下位ほど青。
// 隣接帯のΔEは最小21.8、文字色は地の明るさで白/濃紺を出し分ける
// 上位側を細かく刻む(自団も相手も3000位より上にいるため、粗い帯だと差が出ない)。
// 隣接帯のΔEは最小15.0、文字は地の明るさで白/濃紺を出し分け最小4.69を確保
const RANK_BANDS=[[10,'#4A0F06','〜10位','#fff'],[100,'#8C2317','〜100位','#fff'],
                  [300,'#C1503A','〜300位','#fff'],[500,'#E09872','〜500位','#1c2733'],
                  [1000,'#F2E3D6','〜1000位','#1c2733'],[2000,'#8FB4D4','〜2000位','#1c2733'],
                  [Infinity,'#1F4E79','2000位超','#fff']];
function rankHeatHtml(rh,oursName,oppName){
  if(!rh||!rh.length) return '';
  const raids=[...new Set(rh.map(r=>r.raid))];
  const cell=v=>{
    if(v==null) return '<div class="cell" style="background:var(--bg);color:var(--mut)">—</div>';
    const b=RANK_BANDS.find(x=>v<=x[0]);
    return `<div class="cell" style="background:${b[1]};color:${b[3]}" title="${b[2]}">${v.toLocaleString()}</div>`;
  };
  const row=(nm,key)=>`<div class="rl">${nm}</div>`+rh.map(r=>cell(r[key])).join('');
  const cols=`96px repeat(${rh.length},minmax(44px,1fr))`;
  return `<div class="hm" style="grid-template-columns:${cols}">
      <div></div>${raids.map(r=>{
        const n=rh.filter(x=>x.raid===r).length;
        return `<div class="hd" style="grid-column:span ${n};font-weight:700">第${r}回</div>`;
      }).join('')}
      <div></div>${rh.map(r=>`<div class="hd">${r.label.split('回')[1]}</div>`).join('')}
      ${row(oursName,'ours')}
      ${row(oppName,'opp')}
    </div>
    <div class="hmkey">${RANK_BANDS.map(b=>`<span><i style="background:${b[1]}"></i>${b[2]}</span>`).join('')}</div>`;
}

// gbfdataは毎時更新。毎時3分に取り直し、まだ新データが無ければ3分おきに再試行(最大5回)
function scheduleAutoRefresh(){
  if(timer){ clearTimeout(timer); timer=null; }
  if(!$('#autoRef').checked) return;
  const now=new Date(), next=new Date(now);
  next.setMinutes(3,0,0);
  if(next<=now) next.setHours(next.getHours()+1);
  retryN=0;
  timer=setTimeout(autoTick, next-now);
}
async function autoTick(){
  timer=null;
  if(!$('#autoRef').checked) return;
  const before=LAST_TICK;
  await ($('#dateSel').value==='yosen'?loadYosen():loadLive());
  if(LAST_TICK===before && retryN<5){        // まだgbfdataに反映されていない
    retryN++;
    timer=setTimeout(autoTick, 180000);
  }else{
    scheduleAutoRefresh();                    // 次の毎時へ
  }
}
$('#autoRef').onchange=scheduleAutoRefresh;
if($('#koranAuto')) $('#koranAuto').onchange=scheduleKoranRefresh;
async function loadScout(){
  const q=$('#scoutQ').value.trim(); if(!q)return;
  $('#scoutBody').innerHTML='<div class="load">分析中…(初回は30秒ほど)</div>';
  let d;
  try{ d=await (await fetch('/api/scout?q='+encodeURIComponent(q)+'&raid='+$('#raidSel').value)).json(); }
  catch(e){ $('#scoutBody').innerHTML='<div class="card bad">取得に時間がかかり切断されました。もう一度「分析」を押してください</div>'; return; }
  if(d.error){$('#scoutBody').innerHTML=`<div class="card bad">${d.error}</div>`;return;}
  if(d.candidates){
    const rows=d.candidates.map(c=>`<tr><td style="text-align:left">${c.name}</td><td>${c.prev!=null?c.prev+'億':'—'}</td><td>${c.rank?c.rank+'位':'—'}</td><td><button onclick="$('#scoutQ').value='${c.gid}';loadScout()">この団を分析</button></td></tr>`).join('');
    $('#scoutBody').innerHTML=`<div class="card"><h2>該当団が${d.candidates.length}件${d.prev_label?` — ${d.prev_label}貢献度・総合順位で選択`:''}</h2><table><tr><th style="text-align:left">団名</th><th>${d.prev_label||''}貢献度</th><th>総合順位</th><th></th></tr>${rows}</table></div>`;
    return;
  }
  // 大きい数値はカンマ区切りで読みやすく
  const fN=x=>(x!=null&&x!=='')?(+x).toLocaleString('ja-JP',{minimumFractionDigits:1,maximumFractionDigits:1}):'—';
  let evRows=d.events.map(e=>{
    const dd=e.daily||{};
    const yosen=(dd[1]||0)+(dd[2]||0);
    const hd=[4,5,6,7].map(k=>dd[k]!=null?dd[k]:null);
    const mx=Math.max(...hd.filter(v=>v!=null).concat([-1]));
    const diff=(e.ours_honsen!=null&&e.honsen!=null)?e.ours_honsen-e.honsen:null;
    return `<tr><td>${e.raid}回</td><td style="color:var(--mut)">${fN(yosen)}</td>`
      +hd.map(v=>`<td${(v!=null&&v===mx)?' style="font-weight:700;color:var(--red)"':''}>${fN(v)}</td>`).join('')
      +`<td style="font-weight:600">${fN(e.honsen)}</td><td style="color:var(--mut)">${fN(e.total)}</td><td style="color:var(--mut)">${e.final_rank?e.final_rank+'位':'—'}</td>`
      +`<td class="${diff!=null?(diff>=0?'good':'bad'):''}">${diff!=null?(diff>0?'+':'')+fN(diff):'—'}</td></tr>`;}).join('');
  // 直近イベントと勝敗カウント
  const ev=[...d.events].sort((a,b)=>a.raid-b.raid);      // 古い順
  const last=d.events[0]||{};
  const avgDiff=(d.ours_avg!=null&&d.past_avg!=null)?(d.ours_avg-d.past_avg):null;
  const P=d.prev_day;
  // ライブと同じ構成。判断(勝率・マッチング基準)を1枚のバンドにまとめ、
  // 素の数字は下のストリップへ落とす
  const mxAvg=Math.max(d.ours_avg??0, d.past_avg??0)||1;
  const dayHtml = v => v==null ? '—'
    : (v>=0 ? `<span class="up"><span class="mk">▲</span>+${f1(v)}<span style="font-size:14px;color:var(--mut)">億</span></span>`
            : `<span class="dn"><span class="mk">▼</span>${f1(v)}<span style="font-size:14px;color:var(--mut)">億</span></span>`);
  const cards=`
    <div class="hero">
      <div class="heroTop">
        ${P?`<div class="heroLead"><div class="k">前日貢献度（${P.label}）</div><div class="v">${dayHtml(P.diff)}</div></div>`:''}
        <div class="heroMid">
          <div class="st">本戦の日毎平均（直近3回）</div>
          <div class="bar"><i style="width:${(d.ours_avg??0)/mxAvg*100}%;background:var(--blue)"></i></div>
          <div class="bar" style="margin-top:6px"><i style="width:${(d.past_avg??0)/mxAvg*100}%;background:var(--red)"></i></div>
          <div class="sub">霞桜団 ${f1(d.ours_avg)}億 ／ ${d.name} ${f1(d.past_avg)}億${P?`　<span style="opacity:.8">前日は 霞桜団 ${f1(P.ours)}億 ／ ${d.name} ${f1(P.opp)}億（翌日のマッチング基準）</span>`:''}</div>
        </div>
        ${d.winrate!=null?`<div class="heroWin"><div class="k">霞桜団 勝率目安</div><div class="v">${d.winrate}<span style="font-size:14px;color:var(--mut)">%</span></div></div>`:''}
      </div>
      ${d.win_note?`<div class="heroAct"><span class="tx">直近${d.win_note.raids}回の本戦 <b>${d.win_note.days}日中、霞桜団が上回ったのは ${d.win_note.wins}日</b>。勝率目安はこの実績と日毎平均の比から出しています</span></div>`:''}
    </div>
    <div class="strip">
      <div><div class="k">${d.name} 直近総計</div><div class="v">${f1(last.total)}<span class="u">億</span></div><div class="k">第${last.raid}回 ${last.final_rank?last.final_rank+'位':''}</div></div>
      <div><div class="k">${d.name} 本戦日毎平均</div><div class="v">${f1(d.past_avg)}<span class="u">億</span></div><div class="k">直近3回の本戦</div></div>
      <div><div class="k">霞桜団 本戦日毎平均</div><div class="v">${f1(d.ours_avg)}<span class="u">億</span></div><div class="k">同期間</div></div>
      <div><div class="k">日毎平均の差</div><div class="v">${avgDiff!=null?(avgDiff>=0?'+':'')+f1(avgDiff):'—'}<span class="u">億</span></div><div class="k">霞桜団 − ${d.name}</div></div>
    </div>`;
  // 過去3戦の本戦比較テーブル
  const p3=d.events.slice(0,3);
  // 直近3開催 × 本戦1〜4 の当日貢献度で日別比較
  const DN={4:'本戦1日目',5:'本戦2日目',6:'本戦3日目',7:'本戦4日目'};
  const p3rows=p3.slice().reverse().map(e=>[4,5,6,7].map(k=>{
    const o=(e.ours_honsen_days||{})[k], p=(e.honsen_days||{})[k];
    if(o==null&&p==null) return '';
    const df=(o!=null&&p!=null)?o-p:null;
    const win=df!=null?(df>=0?'<span class="badge" style="background:#e1f5ee;color:#0F6E56">勝</span>':'<span class="badge" style="background:#fcebeb;color:#A32D2D">負</span>'):'';
    return `<tr><td>${e.raid}回 ${DN[k]}</td><td>${f1(o)}</td><td>${f1(p)}</td><td class="${df!=null?(df>=0?'good':'bad'):''}">${df!=null?(df>0?'+':'')+f1(df):'—'}</td><td>${win}</td></tr>`;
  }).join('')).join('');
  const dayWins=p3.reduce((a,e)=>a+[4,5,6,7].filter(k=>{
    const o=(e.ours_honsen_days||{})[k],p=(e.honsen_days||{})[k];
    return o!=null&&p!=null&&o>p;}).length,0);
  const dayN=p3.reduce((a,e)=>a+[4,5,6,7].filter(k=>{
    const o=(e.ours_honsen_days||{})[k],p=(e.honsen_days||{})[k];
    return o!=null&&p!=null;}).length,0);
  $('#scoutBody').innerHTML=`
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><b style="font-size:16px">${d.name}</b> <a href="${d.url}" target="_blank" style="font-size:12px">団ページ↗</a></div>
      </div>
    </div>
    ${cards}
    <div class="card"><h2>直近3開催 本戦1〜4の当日貢献度比較（霞桜団 ${dayWins}勝 / ${dayN}戦）</h2><div class="tw"><table>
      <tr><th>日程</th><th>霞桜団</th><th>${d.name}</th><th>差</th><th>判定</th></tr>${p3rows}</table></div></div>
    <div class="card"><h2>直近3回の本戦貢献度比較</h2><div class="chartbox"><canvas id="scTot"></canvas></div></div>
    <div class="card"><h2>総合順位の推移（直近3開催 予選〜本戦）</h2>${rankHeatHtml(d.rank_history||[],'霞桜団',d.name)}</div>
    <div class="card"><h2 id="scSpdTitle">本戦の最高時速</h2><div id="scSpdBox"><div class="load">時速データ取得中…(20秒ほど)</div></div></div>
    <div class="card"><h2>前日の比較</h2><div id="scPrevBox"><div class="load">前日データ取得中…</div></div></div>
    ${scoutMembersHtml(d.members,d.name)}
    <div class="card"><h2>${d.name} の過去実績（億）</h2><div class="tw"><table>
      <tr><th>回</th><th>予選</th><th>本1</th><th>本2</th><th>本3</th><th>本4</th><th>本戦計</th><th>総計</th><th>順位</th><th>霞桜団との差</th></tr>${evRows}</table></div>
      <div style="font-size:11px;color:var(--mut);margin-top:6px">赤字=その回で最も稼いだ本戦日 ／ 差=霞桜団の本戦計 − 相手の本戦計</div></div>`;
  // 直近3開催 × 本戦1〜4 の当日貢献度
  const dl=[], do1=[], dp1=[];
  p3.slice().reverse().forEach(e=>[4,5,6,7].forEach(k=>{
    const o=(e.ours_honsen_days||{})[k], p=(e.honsen_days||{})[k];
    if(o==null&&p==null) return;
    dl.push(`${e.raid}回${DN[k].replace('本戦','本')}`); do1.push(o??null); dp1.push(p??null);
  }));
  mkChart('#scTot','bar',dl,[
    {label:'霞桜団',data:do1,bar:'#378ADD',borderRadius:4,borderSkipped:false},
    {label:d.name,data:dp1,bar:'#D85A30',borderRadius:4,borderSkipped:false}
  ],{datasets:{bar:{categoryPercentage:.72,barPercentage:.92}}});
  loadScoutSpeed(d.gid, d.name);
}
async function loadScoutSpeed(gid,oppName){
  const box=$('#scSpdBox'); if(!box) return;
  let s;
  try{ s=await (await fetch('/api/scout_speed?gid='+gid+'&raid='+$('#raidSel').value)).json(); }
  catch(e){ box.innerHTML='<div style="font-size:12px;color:var(--mut)">時速データの取得に時間がかかり切断されました</div>'; return; }
  if(!$('#scSpdBox')) return;                       // 別の検索に切り替わっていたら中断
  scoutPrevView(s.prev,oppName);
  if(s.error||!s.days||!s.days.length){ box.innerHTML=`<div style="font-size:12px;color:var(--mut)">${s.error||'この回の時刻毎データはgbfdataに未収録です'}</div>`; return; }
  const L=s.days.map(x=>x.label);
  const om=s.days.map(x=>x.ours_max), oa=s.days.map(x=>x.ours_avg);
  const pm=s.days.map(x=>x.opp_max), pa=s.days.map(x=>x.opp_avg);
  const cell=(a,b)=>`<td class="${(a!=null&&b!=null)?(a>=b?'good':'bad'):''}">${(a!=null&&b!=null)?((a-b>0?'+':'')+f1(a-b)):'—'}</td>`;
  const rowsMax=s.days.map(x=>`<tr><td>${x.label}</td><td>${f1(x.ours_max)}</td><td>${f1(x.opp_max)}</td>${cell(x.ours_max,x.opp_max)}</tr>`).join('');
  const rowsAvg=s.days.map(x=>`<tr><td>${x.label}</td><td>${f1(x.ours_avg)}</td><td>${f1(x.opp_avg)}</td>${cell(x.ours_avg,x.opp_avg)}</tr>`).join('');
  box.innerHTML=`
    <div class="minitabs">
      <button class="minitab on" data-spd="max" onclick="scoutSpeedTab('max')">最高時速</button>
      <button class="minitab" data-spd="avg" onclick="scoutSpeedTab('avg')">平均時速</button>
    </div>
    <div class="chartbox"><canvas id="scSpd"></canvas></div>
    <div id="scSpdTable" style="overflow-x:auto;margin-top:10px"></div>`;
  SPD={L, om, oa, pm, pa, oppName,
       tblMax:`<div class="tw"><table><tr><th>日程</th><th>霞桜団 最高時速</th><th>${oppName} 最高時速</th><th>最高時速差</th></tr>${rowsMax}</table></div>`,
       tblAvg:`<div class="tw"><table><tr><th>日程</th><th>霞桜団 平均時速</th><th>${oppName} 平均時速</th><th>平均時速差</th></tr>${rowsAvg}</table></div>`};
  scoutSpeedTab('max');
}
function scoutPrevView(prev,oppName){
  const box=$('#scPrevBox'); if(!box) return;
  if(!prev){ box.innerHTML='<div style="font-size:12px;color:var(--mut)">前日のデータがありません</div>'; return; }
  if(prev.mode==='daily'){
    const rows=prev.rows.map(r=>{const df=(r.ours!=null&&r.opp!=null)?r.ours-r.opp:null;
      return `<tr><td>${r.label}</td><td>${f1(r.ours)}</td><td>${f1(r.opp)}</td><td class="${df!=null?(df>=0?'good':'bad'):''}">${df!=null?(df>0?'+':'')+f1(df):'—'}</td></tr>`;}).join('');
    box.innerHTML=`<div style="font-size:12px;color:var(--mut);margin-bottom:6px">${prev.label}</div>
      <div class="tw"><table><tr><th>日程</th><th>霞桜団</th><th>${oppName}</th><th>差</th></tr>${rows}</table></div>`;
    return;
  }
  const T=prev.times, oc=prev.ours.cum, os=prev.ours.speed, pc=prev.opp.cum, ps=prev.opp.speed;
  const ork=prev.ours.rank||{}, prk=prev.opp.rank||{};
  const rk=v=>v?v.toLocaleString('ja-JP')+'位':'—';
  const mO=mxOf(T.map(t=>os[t])), mP2=mxOf(T.map(t=>ps[t]));
  const rows=T.filter(t=>oc[t]!=null||pc[t]!=null).map(t=>{
    const o=oc[t],p=pc[t],df=(o!=null&&p!=null)?o-p:null;
    return `<tr><td>${hLbl(t)}時</td><td>${f1(o)}</td><td style="color:var(--mut)">${rk(ork[t])}</td><td class="sp${mxCls(os[t],mO)}">${f1(os[t])}</td><td>${f1(p)}</td><td style="color:var(--mut)">${rk(prk[t])}</td><td class="sp${mxCls(ps[t],mP2)}">${f1(ps[t])}</td><td class="${df!=null?(df>=0?'good':'bad'):''}">${df!=null?(df>0?'+':'')+f1(df):'—'}</td></tr>`;}).join('');
  if(!rows){ box.innerHTML='<div style="font-size:12px;color:var(--mut)">前日の時刻毎データはgbfdataに未収録です</div>'; return; }
  const L=T.filter(t=>oc[t]!=null||pc[t]!=null);
  box.innerHTML=`<div style="font-size:12px;color:var(--mut);margin-bottom:10px">${prev.label}</div>
    <div class="subcap">累積貢献度（億）</div>
    <div class="chartbox"><canvas id="scPrevCum"></canvas></div>
    <div class="subcap" style="margin-top:16px">時速（億/h）</div>
    <div class="chartbox"><canvas id="scPrevSpd"></canvas></div>
    <div style="overflow-x:auto;margin-top:16px"><table><tr><th>時刻</th><th>霞桜団</th><th>総合順位</th><th>時速</th><th>${oppName}</th><th>総合順位</th><th>時速</th><th>差</th></tr>${rows}</table></div>`;
  const lab=L.map(hLbl);
  mkChart('#scPrevCum','line',lab,[
    {label:'霞桜団',data:L.map(t=>oc[t]??null),borderColor:'#378ADD',area:'3d',endLabel:true,tension:.35,borderWidth:2,pointRadius:0,spanGaps:true},
    {label:oppName,data:L.map(t=>pc[t]??null),borderColor:'#D85A30',endLabel:true,tension:.35,borderWidth:2,pointRadius:0,spanGaps:true}
  ]);
  mkChart('#scPrevSpd','line',lab,[
    {label:'霞桜団',data:L.map(t=>os[t]??null),borderColor:'#378ADD',tension:.35,borderWidth:2,pointRadius:0,spanGaps:true},
    {label:oppName,data:L.map(t=>ps[t]??null),borderColor:'#D85A30',tension:.35,borderWidth:2,pointRadius:0,spanGaps:true}
  ]);
}
let SPD=null;
function scoutMembersHtml(mv,name){
  if(!mv) return `<div class="card"><h2>${name} の団員一覧</h2>
    <div style="font-size:12px;color:var(--mut)">この団は団員一覧を非公開にしています（gbfdataに登録がありません）。上位団ほど非公開の傾向があります。</div></div>`;
  const ctx=mv.context||{}, lbl=KORAN_LBL[ctx.day_of]||'';
  const share=(mv.total&&mv.top5)?Math.round(mv.top5/mv.total*100):null;
  const rows=mv.rows.map((r,i)=>`<tr><td style="color:var(--mut)">${i+1}</td><td>${r.name??'—'}</td>`
    +`<td>${r.point!=null?f1(r.point):'—'}</td>`
    +`<td style="color:var(--mut)">${r.rank?r.rank.toLocaleString('ja-JP')+'位':'—'}</td></tr>`).join('');
  return `<div class="card"><h2>${name} の団員一覧（${lbl}時点・億）</h2>
    <div style="font-size:12px;color:var(--mut);margin-bottom:8px">${mv.count}人中 ${mv.ranked}人に貢献度の記録あり ／ 合計 ${f1(mv.total)}億${share!=null?` ／ 上位5人で ${f1(mv.top5)}億（全体の${share}%）`:''}</div>
    <div class="tw"><table><tr><th>団内</th><th>名前</th><th>貢献度</th><th>個人順位</th></tr>${rows}</table></div>
    <div style="font-size:11px;color:var(--mut);margin-top:6px">貢献度の多い順。記録が無い団員は今回の個人ランキング圏外です。</div></div>`;
}
function scoutSpeedTab(mode){
  if(!SPD) return;
  document.querySelectorAll('.minitab').forEach(b=>b.classList.toggle('on', b.dataset.spd===mode));
  const isMax=mode==='max';
  $('#scSpdTable').innerHTML=isMax?SPD.tblMax:SPD.tblAvg;
  // 見出しは選択中のタブに追従させる(最高/平均どちらを見ているか一目で分かるように)
  const t=$('#scSpdTitle');
  if(t) t.textContent=`本戦の${isMax?'最高':'平均'}時速`;
  mkChart('#scSpd','bar',SPD.L,[
    {label:'霞桜団',data:isMax?SPD.om:SPD.oa,bar:'#378ADD',borderRadius:4,borderSkipped:false},
    {label:SPD.oppName,data:isMax?SPD.pm:SPD.pa,bar:'#D85A30',borderRadius:4,borderSkipped:false}
  ],{datasets:{bar:{categoryPercentage:.72,barPercentage:.92}}});
}
// 個ランの判断バンド。ライブ・サーチ・予選と同じ構成に揃える。
// 左=本人の累積、中=本人と2本のラインの比較バー、右=着地、下帯=到達判定
function koranHero(o){
  const {name,player,rank,label,b2000,b100k,vs2000,vs100k,s2,s1,proj,confirmed,projLabel}=o;
  const vals=[player,s2?b2000:null,s1?b100k:null].filter(v=>v!=null);
  const mx=vals.length?Math.max(...vals):1;
  const bar=(v,color)=>v==null?'':`<div class="bar" style="margin-top:6px"><i style="width:${v/mx*100}%;background:${color}"></i></div>`;
  const note=[];
  if(s2&&vs2000!=null) note.push(vs2000>=0?`<b class="up">英雄ライン超え +${f1(vs2000)}億</b>`:`英雄ラインまで <b>${f1(-vs2000)}億</b>`);
  if(s1&&vs100k!=null) note.push(vs100k>=0?`<b class="up">10万位 圏内 +${f1(vs100k)}億</b>`:`<b class="dn">10万位まで ${f1(-vs100k)}億</b>`);
  return `<div class="hero">
    <div class="heroTop">
      <div class="heroLead"><div class="k">${name} 累積貢献度</div>
        <div class="v">${f1(player)}<span style="font-size:16px;color:var(--mut)">億</span></div></div>
      <div class="heroMid">
        <div class="st">${rank?rank.toLocaleString('ja-JP')+'位':''}${label?`　<span class="k" style="font-weight:400">${label}時点</span>`:''}</div>
        <div class="bar"><i style="width:${(player??0)/mx*100}%;background:var(--blue)"></i></div>
        ${s2?bar(b2000,'var(--red)'):''}${s1?bar(b100k,'var(--green)'):''}
        <div class="sub">本人 ${f1(player)}億${s2?` ／ 英雄(2000位) ${f1(b2000)}億`:''}${s1?` ／ 10万位 ${f1(b100k)}億`:''}</div>
      </div>
      ${proj!=null?`<div class="heroWin"><div class="k">${confirmed?'着地':'着地目安'}</div>
        <div class="v">${f1(proj)}<span style="font-size:14px;color:var(--mut)">億</span></div>
        <div class="k">${confirmed?'確定値':(projLabel||'前回ペース比')}</div></div>`:''}
    </div>
    ${note.length?`<div class="heroAct"><span class="tx">${note.join('　／　')}</span></div>`:''}
  </div>`;
}
function koranPast3Html(p3,s2,s1,name){
  if(!p3||!p3.labels) return '';
  const head=p3.labels.map(l=>`<th>${l}</th>`).join('');
  const row=(lbl,arr)=>`<tr><td style="text-align:left">${lbl}</td>${arr.map(v=>`<td>${f1(v)}</td>`).join('')}</tr>`;
  let rows=row(name,p3.player);
  if(s2) rows+=row('英雄(2000位)',p3.b2000);
  if(s1) rows+=row('10万位',p3.b100k);
  return `<div class="card"><h2>参考：直近6回の着地（億）</h2><div class="tw"><table><tr><th style="text-align:left">ライン</th>${head}</tr>${rows}</table></div>
    <div style="font-size:11px;color:var(--mut);margin-top:6px">※2000位/10万位はgbfdata優先、無い回はGameWith履歴で補完（第77回まで。それ以前は—）。本人は履歴のある範囲で表示。</div></div>`;
}
// 着地の値は判断バンドの右とストリップに出るので、ここでは見込みの文だけ返す
function koranTimeProjHtml(P,s2,s1,name,confirmed){
  if(!P||P.player==null) return '';
  const note=[];
  if(s2&&P.vs2000!=null)note.push(P.vs2000>=0?`<b class="up">英雄到達見込み +${f1(P.vs2000)}億</b>`:`英雄まで ${f1(-P.vs2000)}億`);
  if(s1&&P.vs100k!=null)note.push(P.vs100k>=0?`10万位 圏内見込み`:`<b class="dn">10万位 圏外見込み</b>`);
  if(!note.length) return '';
  return `<div class="card" style="font-size:13px;color:var(--mut)">着地見込み：${note.join('　／　')}</div>`;
}
// 団員(サーバのMEMBERS)から選ぶセレクタ。名簿はサーバが持ち、画面では変更しない
const kmList=()=>(cfg&&cfg.members)?cfg.members:[];
function renderKoranMem(){
  const sel=$('#koranMem'); if(!sel) return;
  const cur=$('#koranQ')?$('#koranQ').value.trim():'';
  sel.innerHTML='<option value="">団員から選ぶ…</option>'
    +kmList().map(m=>`<option value="${m.uid}" ${String(m.uid)===cur?'selected':''}>${m.name}</option>`).join('');
}
function pickKoranMem(){
  const v=$('#koranMem').value; if(!v) return;
  $('#koranQ').value=v; loadKoran();
}

async function loadKoranAll(){
  $('#koranBody').innerHTML='<div class="load">団全体を集計中…(30名で数秒)</div>';
  const uids=kmList().map(m=>m.uid).join(',');
  let d;
  try{ d=await (await fetch('/api/koran_all?raid='+$('#raidSel').value+'&uids='+uids)).json(); }
  catch(e){ $('#koranBody').innerHTML='<div class="card bad">取得に時間がかかり切断されました。もう一度押してください</div>'; return; }
  if(d.error){ $('#koranBody').innerHTML=`<div class="card bad">${d.error}</div>`; return; }
  KORAN_TICK='all:'+(d.at||'')+':'+d.total;
  const b2=d.lines['2000'], b1=d.lines['100000'];
  // ラインに届いているかは「到達 +◯」「あと ◯」で出す。赤は使わない(相手団の色と紛れるため)
  const cell=(v,lv)=>v==null||lv==null?'<td>—</td>'
    :(v>=lv?`<td class="good">到達 +${f1(v-lv)}</td>`:`<td>あと ${f1(lv-v)}</td>`);
  const dsum=r=>Object.values(r.days).reduce((a,b)=>a+b,0);
  // 日ごとのTOP5。同値は同じ順位にしたいので、値の重複を潰してから上位5つを取る
  const TOPN=5, dayTop={};
  d.days.forEach(x=>{
    dayTop[x.day_of]=[...new Set(d.rows.map(r=>r.days[x.day_of]).filter(v=>v!=null&&v>0))]
      .sort((a,b)=>b-a).slice(0,TOPN);
  });
  const topCls=(v,do_)=>{ const i=(dayTop[do_]||[]).indexOf(v); return i<0?'sp':'t'+(i+1); };

  $('#koranBody').innerHTML=`
    <div class="strip">
      <div><div class="k">人数</div><div class="v">${d.n}<span class="u">名</span></div><div class="k">${d.at?d.at+'時点':''}</div></div>
      <div><div class="k">個人貢献度の合計</div><div class="v">${f1(d.total)}<span class="u">億</span></div><div class="k">一覧の合計</div></div>
      <div><div class="k">英雄(2000位)</div><div class="v">${f1(b2)}<span class="u">億</span></div><div class="k">到達 ${d.rows.filter(r=>r.cum!=null&&b2!=null&&r.cum>=b2).length}名</div></div>
      <div><div class="k">10万位</div><div class="v">${f1(b1)}<span class="u">億</span></div><div class="k">到達 ${d.rows.filter(r=>r.cum!=null&&b1!=null&&r.cum>=b1).length}名</div></div>
    </div>
    <div class="card"><h2>到達状況（第${d.raid}回）</h2><div class="tw"><table class="rank">
      <tr><th></th><th>名前</th><th>累積</th><th>全体順位</th><th>英雄(2000位)</th><th>10万位</th></tr>
      ${d.rows.map((r,i)=>`<tr>
        <td style="color:var(--mut)">${i+1}</td>
        <td>${r.name}</td><td>${f1(r.cum)}</td>
        <td style="color:var(--mut)">${r.rank?r.rank.toLocaleString()+'位':'—'}</td>
        ${cell(r.cum,b2)}${cell(r.cum,b1)}
        <td><button style="font-size:11.5px;padding:2px 9px" onclick="$('#koranQ').value='${r.uid}';loadKoran()">詳細</button></td></tr>`).join('')}
    </table></div></div>
    <div class="card"><h2>累積と日別の内訳（億）</h2>
      <div class="chartbox" style="height:${Math.max(240, d.rows.length*19+64)}px"><canvas id="kAll"></canvas></div>
    </div>
    <div class="card"><h2>日別の貢献度（億）</h2><div class="tw"><table class="rank">
      <tr><th></th><th>名前</th>${d.days.map(x=>`<th>${x.label}</th>`).join('')}<th>合計</th></tr>
      ${d.rows.map((r,i)=>`<tr>
        <td style="color:var(--mut)">${i+1}</td><td>${r.name}</td>
        ${d.days.map(x=>{const v=r.days[x.day_of];
          return `<td class="${v==null?'sp':topCls(v,x.day_of)}">${f1(v)}</td>`;}).join('')}
        <td>${f1(dsum(r))}</td></tr>`).join('')}
    </table></div>
    </div>`;

  // 30人を折れ線で重ねると読めないので、1人1行の横向き積み上げ棒にする。
  // 色は日程順の1色グラデ(薄い=予選 → 濃い=本戦4日目)。隣り合う段のΔEは10以上あり見分けられる
  const RAMP=['#DCE9F6','#BBD5EC','#98BFE0','#73A6D3','#4F8CC5','#2F6FAE','#1B5183'];
  mkChart('#kAll','bar', d.rows.map(r=>r.name),
    d.days.map((x,i)=>({label:x.label, backgroundColor:RAMP[i%RAMP.length], borderWidth:0,
      data:d.rows.map(r=>r.days[x.day_of]??0)})),
    {indexAxis:'y',
     // ⚠️ 横棒では axis:'y' が要る。既定のxのままだと横方向の距離で近い要素を探すため、
     //    行を指しているのに別の行が選ばれるなど選択が乱れる
     interaction:{mode:'index',intersect:false,axis:'y'},
     refLines:[{v:b2,color:'#C0431C',label:'英雄(2000位)'},
               {v:b1,color:'#14805C',label:'10万位'}],
     plugins:{legend:{display:false},
       tooltip:{backgroundColor:'rgba(24,33,44,.94)',titleColor:'#fff',bodyColor:'#e7edf4',
         borderColor:'rgba(255,255,255,.14)',borderWidth:1,padding:10,cornerRadius:7,
         boxWidth:8,boxHeight:8,usePointStyle:true,
         titleFont:{size:12,weight:'700'},bodyFont:{size:12},footerFont:{size:12,weight:'700'},
         // 0の日は並べても読みにくいだけなので伏せる。合計は積み上げの総和＝累積
         filter:it=>it.parsed.x>0,
         callbacks:{label:it=>' '+it.dataset.label+'  '+f1(it.parsed.x),
           footer:its=>'累積  '+f1(its.reduce((a,it)=>a+it.parsed.x,0))}}},
     scales:{x:{stacked:true,grid:{color:'rgba(28,39,51,.05)',drawTicks:false},border:{display:false},
                ticks:{color:'#68707a',font:{size:10},maxTicksLimit:5}},
             y:{stacked:true,grid:{display:false},border:{color:'rgba(28,39,51,.10)'},
                ticks:{color:'#1c2733',font:{size:10.5},autoSkip:false}}}});
}

async function loadKoran(){
  const q=$('#koranQ').value.trim(); if(!q)return;
  $('#koranBody').innerHTML='<div class="load">検索中…(初回は30秒ほど)</div>';
  let d;
  try{ d=await (await fetch('/api/koran?q='+encodeURIComponent(q)+'&raid='+$('#raidSel').value)).json(); }
  catch(e){ $('#koranBody').innerHTML='<div class="card bad">取得に時間がかかり切断されました。もう一度「検索」を押してください</div>'; return; }
  if(d.error){$('#koranBody').innerHTML=`<div class="card bad">${d.error}</div>`;return;}
  if(d.candidates){
    const rows=d.candidates.map(c=>`<tr><td style="text-align:left">${c.name}</td><td>${c.rank?c.rank+'位':'—'}</td><td>${f1(c.point)}億</td><td><button onclick="$('#koranQ').value='${c.user_id}';loadKoran()">このプレイヤー</button></td></tr>`).join('');
    $('#koranBody').innerHTML=`<div class="card"><h2>該当プレイヤーが${d.candidates.length}件 — 現在順位・累積で選択</h2><table><tr><th style="text-align:left">名前</th><th>現順位</th><th>累積</th><th></th></tr>${rows}</table></div>`;
    return;
  }
  const tg=$('#koranTgt').value, s2=tg!=='100k', s1=tg!=='2000';
  const L=d.latest||{};
  KORAN_TICK='d:'+((L.label||'')+':'+(L.player??''));
  const vs2=v=> v==null?'':(v>=0?`<span class="good">英雄ライン超え +${f1(v)}億</span>`:`英雄ラインまで ${f1(-v)}億`);
  const vs1=v=> v==null?'':(v>=0?`<span class="good">10万位 圏内 +${f1(v)}億</span>`:`<span class="bad">10万位まで ${f1(-v)}億</span>`);
  const Px=d.proj||{};
  const cards=koranHero({name:d.name,player:L.player,rank:L.rank,label:L.label,
    b2000:L.b2000,b100k:L.b100k,vs2000:L.vs2000,vs100k:L.vs100k,s2,s1,
    proj:Px.player,confirmed:d.confirmed,
    projLabel:Px.prev_raid?`前回第${Px.prev_raid}回のペース比`:''})
   +`<div class="strip">
      ${s2?`<div><div class="k">英雄ライン(2000位)</div><div class="v">${f1(L.b2000)}<span class="u">億</span></div><div class="k">${vs2(L.vs2000)}</div></div>`:''}
      ${s1?`<div><div class="k">10万位ライン</div><div class="v">${f1(L.b100k)}<span class="u">億</span></div><div class="k">${vs1(L.vs100k)}</div></div>`:''}
      ${s2&&Px.b2000!=null?`<div><div class="k">英雄ライン ${d.confirmed?'着地':'着地目安'}</div><div class="v">${f1(Px.b2000)}<span class="u">億</span></div><div class="k">${d.confirmed?'確定値':'前回最終からの予測'}</div></div>`:''}
      ${s1&&Px.b100k!=null?`<div><div class="k">10万位ライン ${d.confirmed?'着地':'着地目安'}</div><div class="v">${f1(Px.b100k)}<span class="u">億</span></div><div class="k">${d.confirmed?'確定値':'前回最終からの予測'}</div></div>`:''}
    </div>`;
  const P=d.proj||{};
  const projNote=(v2,v1)=>{const s=[];
    if(s2&&v2!=null)s.push(v2>=0?`<span class="good">英雄ライン到達見込み +${f1(v2)}億</span>`:`英雄ラインまで ${f1(-v2)}億`);
    if(s1&&v1!=null)s.push(v1>=0?`10万位 圏内見込み`:`<span class="bad">10万位 圏外見込み</span>`);
    return s.join(' / ');};
  // 着地は判断バンドの右とストリップに吸収したので、着地見込みの文だけ残す
  const projSection=(P.player!=null&&projNote(P.vs2000,P.vs100k))
    ? `<div class="card" style="font-size:13px;color:var(--mut)">着地見込み：${projNote(P.vs2000,P.vs100k)}</div>` : '';
  const cell=(v,neg)=>`<td class="${v!=null?(v>=0?'good':'bad'):''}">${v!=null?(v>=0?'+':'')+f1(v):'—'}</td>`;
  const trows=d.rows.map(r=>`<tr><td>${r.label}</td><td>${f1(r.player)}</td><td style="color:var(--mut)">${r.rank?r.rank+'位':'—'}</td>`
    +(s2?`<td>${f1(r.b2000)}</td>${cell(r.vs2000)}`:'')
    +(s1?`<td>${f1(r.b100k)}</td>${cell(r.vs100k)}`:'')+`</tr>`).join('');
  $('#koranBody').innerHTML=`
    <div class="card"><div class="row" style="justify-content:space-between"><div><b style="font-size:16px">${d.name}</b> <a href="${d.url}" target="_blank" style="font-size:12px">gbfdata↗</a></div></div></div>
    ${cards}
    ${projSection}
    <div class="card"><h2>累積貢献度の推移（億）</h2><div class="chartbox"><canvas id="kCum"></canvas></div></div>
    <div class="card"><h2>日別の比較（数値・億）</h2><div class="tw"><table><tr><th>日程</th><th>${d.name}</th><th>順位</th>${s2?'<th>英雄(2000位)</th><th>差</th>':''}${s1?'<th>10万位</th><th>差</th>':''}</tr>${trows}</table></div></div>
    ${koranPast3Html(d.past3,s2,s1,d.name)}
    <div id="koranHourBox"></div>`;
  loadKoranHour(q, koranTargetDay(d.rows), d.name, s2, s1);
  const Lx=d.rows.map(r=>r.label);
  mkChart('#kCum','line',Lx,[
    {label:d.name,data:d.rows.map(r=>r.player),borderColor:'#378ADD',area:'3d',endLabel:true,tension:0.35,borderWidth:2,pointRadius:0},
    ...(s2?[{label:'英雄(2000位)',data:d.rows.map(r=>r.b2000),borderColor:'#D85A30',endLabel:true,tension:0.35,borderWidth:2,pointRadius:0}]:[]),
    ...(s1?[{label:'10万位',data:d.rows.map(r=>r.b100k),borderColor:'#1D9E75',endLabel:true,tension:0.35,borderWidth:2,pointRadius:0}]:[])
  ]);
}
// 個ランの自動更新(ライブと同じ: 毎時3分＋3分おき再試行)
let kTimer=null, KORAN_TICK=null, kRetryN=0;
function scheduleKoranRefresh(){
  if(kTimer){ clearTimeout(kTimer); kTimer=null; }
  if(!$('#koranAuto')?.checked) return;
  const now=new Date(), next=new Date(now);
  next.setMinutes(3,0,0);
  if(next<=now) next.setHours(next.getHours()+1);
  kRetryN=0;
  kTimer=setTimeout(koranTick, next-now);
}
async function koranTick(){
  kTimer=null;
  if(!$('#koranAuto')?.checked) return;
  if(!$('#koranQ').value.trim()){ scheduleKoranRefresh(); return; }
  const before=KORAN_TICK;
  await loadKoran();
  if(KORAN_TICK===before && kRetryN<5){ kRetryN++; kTimer=setTimeout(koranTick,180000); }
  else scheduleKoranRefresh();
}
// 開いた日の時刻毎。概要より重い(順位が深い人は数十秒)ので、
// 概要を先に出してから非同期で追記する(サーチの時速と同じ方式)
// 時刻毎の対象日を切り替えるためのプルダウン。既定は開催中なら当日、終了後は最終日だが、
// 予選〜本戦4日目のどれでも選べるようにする(引数を覚えておいて選び直しで取り直す)
let KH={q:null,name:null,s2:true,s1:true};
function khDays(){
  return (cfg.schedules||[]).slice().sort((a,b)=>a.day_of-b.day_of);
}
function khSelHtml(day){
  return `<select id="khSel" onchange="khPick(this.value)" style="margin-left:auto">`
    +khDays().map(s=>`<option value="${s.day}" ${s.day===day?'selected':''}>${KORAN_LBL[s.day_of]||s.day}</option>`).join('')
    +`</select>`;
}
function khPick(day){
  const sch=khDays().find(s=>s.day===day);
  if(sch) loadKoranHour(KH.q, sch, KH.name, KH.s2, KH.s1);
}
async function loadKoranHour(q, sch, name, s2, s1){
  const box=$('#koranHourBox'); if(!box||!sch) return;
  KH={q,name,s2,s1};
  const lbl=KORAN_LBL[sch.day_of]||sch.day;
  const hd=t=>`<div class="row" style="margin-bottom:10px"><h2 style="margin:0">${t}</h2>${khSelHtml(sch.day)}</div>`;
  box.innerHTML=`<div class="card">${hd(lbl+' の時刻毎（億/1H）')}<div class="load">取得中…(順位が深いと1分ほどかかります)</div></div>`;
  let d;
  try{ d=await (await fetch('/api/koran?q='+encodeURIComponent(q)+'&raid='+$('#raidSel').value+'&day='+sch.day)).json(); }
  catch(e){ if(document.body.contains(box)) box.innerHTML='<div class="card" style="font-size:12px;color:var(--mut)">時刻毎データの取得に失敗しました</div>'; return; }
  // 時刻毎は数十秒かかる。待っている間に別の表示(団全体など)へ切り替わっていたら、
  // 枠ごと消えているので何もしない(消えたcanvasにmkChartが描こうとして落ちる)
  if(!document.body.contains(box)) return;
  if(d.error||!d.times||!d.times.length){
    box.innerHTML=`<div class="card">${hd(lbl+' の時刻毎（億/1H）')}
      <div style="font-size:12px;color:var(--mut)">${d.error||'この日の時刻毎データはgbfdataに未収録です'}</div></div>`; return;
  }
  const T=d.times, Lx=d.labels;
  const pc=d.player.cum, prk=d.player.rank, psp=d.player.speed;
  const b2=d.b2000.cum, b2s=d.b2000.speed, b1=d.b100k.cum, b1s=d.b100k.speed;
  const dcell=v=>`<td class="${v!=null?(v>=0?'good':'bad'):''}">${v!=null?(v>=0?'+':'')+f1(v):'—'}</td>`;
  const mP=mxOf(T.map(t=>psp[t])), m2=mxOf(T.map(t=>b2s[t])), m1=mxOf(T.map(t=>b1s[t]));
  const trows=T.map((t,i)=>{const dd2=(pc[t]!=null&&b2[t]!=null)?pc[t]-b2[t]:null, dd1=(pc[t]!=null&&b1[t]!=null)?pc[t]-b1[t]:null;
    return `<tr><td>${Lx[i]}</td><td>${f1(pc[t])}</td><td style="color:var(--mut)">${prk[t]?prk[t].toLocaleString('ja-JP')+'位':'—'}</td><td class="sp${mxCls(psp[t],mP)}">${f1(psp[t])}</td>`
      +(s2?`<td>${f1(b2[t])}</td><td class="sp${mxCls(b2s[t],m2)}">${f1(b2s[t])}</td>${dcell(dd2)}`:'')
      +(s1?`<td>${f1(b1[t])}</td><td class="sp${mxCls(b1s[t],m1)}">${f1(b1s[t])}</td>${dcell(dd1)}`:'')+`</tr>`;}).join('');
  box.innerHTML=`
    <div class="card">${hd(d.label+' 累積の推移（億/1H）')}<div class="chartbox"><canvas id="kCumH"></canvas></div></div>
    <div class="card"><h2>${d.label} 時速（億/1H）</h2><div class="chartbox"><canvas id="kSpdH"></canvas></div></div>
    <div class="card"><h2>${d.label}（億単位）</h2><div class="tw"><table><tr><th>時刻</th><th>${name}</th><th>順位</th><th>時速</th>${s2?'<th>2000位</th><th>時速</th><th>差</th>':''}${s1?'<th>10万位</th><th>時速</th><th>差</th>':''}</tr>${trows}</table></div></div>`;
  mkChart('#kCumH','line',Lx,[
    {label:name,data:T.map(t=>pc[t]??null),borderColor:'#378ADD',area:'3d',endLabel:true,tension:0.35,borderWidth:2,pointRadius:0,spanGaps:true},
    ...(s2?[{label:'英雄(2000位)',data:T.map(t=>b2[t]??null),borderColor:'#D85A30',endLabel:true,tension:0.35,borderWidth:2,pointRadius:0,spanGaps:true}]:[]),
    ...(s1?[{label:'10万位',data:T.map(t=>b1[t]??null),borderColor:'#1D9E75',endLabel:true,tension:0.35,borderWidth:2,pointRadius:0,spanGaps:true}]:[])
  ]);
  mkChart('#kSpdH','line',Lx,[
    {label:name,data:T.map(t=>psp[t]??null),borderColor:'#378ADD',tension:0.35,borderWidth:2,pointRadius:0,spanGaps:true},
    ...(s2?[{label:'英雄(2000位)',data:T.map(t=>b2s[t]??null),borderColor:'#D85A30',tension:0.35,borderWidth:1.4,pointRadius:0,spanGaps:true}]:[]),
    ...(s1?[{label:'10万位',data:T.map(t=>b1s[t]??null),borderColor:'#1D9E75',tension:0.35,borderWidth:1.4,pointRadius:0,spanGaps:true}]:[])
  ]);
}
init();
</script>
