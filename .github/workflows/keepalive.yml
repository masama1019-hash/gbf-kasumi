# Render無料プランは15分アクセスが無いとスリープし、次のアクセスに約50秒かかる。
# 定期的に叩いて起こし続けることで、この待ちを無くす。
#
# 稼働時間の考え方:
#   無料枠は「ワークスペースあたり月750インスタンス時間」。24時間起こし続けると
#   31日の月で744時間となり余裕が6時間しか残らず、他に無料サービスがあると
#   月内に全部止まる。そこで JST 05:00〜翌01:00 の20時間だけ起こす(月620時間)。
#   本戦(7〜24時)は完全にカバーし、予選の深夜も1時まで対応する。
#   24時間にしたい場合は下の cron を "*/10 * * * *" に変える。
name: keepalive

on:
  schedule:
    # UTC表記。0-15時=JST 9:00〜翌0:59、20-23時=JST 5:00〜8:59
    - cron: "*/10 0-15,20-23 * * *"
  workflow_dispatch:        # 手動でも実行できるようにしておく

# 同時に走っても意味が無いので、重なったら古い方を捨てる
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the app
        run: |
          # 静的ページだけを叩く(gbfdataへは問い合わせないので相手サイトに負荷をかけない)
          code=$(curl -sS -o /dev/null -w '%{http_code} %{time_total}s' \
                   --max-time 120 --retry 2 --retry-delay 10 \
                   https://gbf-kasumi.onrender.com/)
          echo "response: $code"
          case "$code" in
            200*) ;;
            *) echo "::warning::予期しない応答: $code" ;;
          esac
